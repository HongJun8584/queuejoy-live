<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queue Joy - Digital Queue System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --card-radius: 1rem;
      --theme-color: #8b5cf6;
      --theme-color-dark: #6d28d9;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    .fade-in {
      animation: fadeIn 0.45s cubic-bezier(.2,.9,.2,1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) }
      to { opacity: 1; transform: translateY(0) }
    }

    .db-image { max-height: 180px; object-fit: cover; }
    .media-cover { width:100%; height:180px; object-fit:cover; display:block }

    #siteLogo,
    #centerLogo {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(139,92,246,0.10), rgba(59,130,246,0.08));
      border: 1px solid rgba(139,92,246,0.12);
    }

    #siteLogo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
    }

    #centerLogo {
      width: 80px;
      height: 80px;
      border-radius: 9999px;
    }

    .logo-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .logo-small { width:48px; height:48px; object-fit:contain; border-radius:16px }
    .logo-center { width:80px; height:80px; object-fit:contain; border-radius:9999px }

    .sync-hint {
      min-height: 18px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      child,
      push,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const siteFirebaseConfig = {
      apiKey: "AIzaSyDiRGvkQbnLlpnJT3fEEQrY1A3nwLVIFY0",
      authDomain: "queue-joy-aa21b.firebaseapp.com",
      databaseURL: "https://queue-joy-aa21b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "queue-joy-aa21b",
      storageBucket: "queue-joy-aa21b.appspot.com",
      messagingSenderId: "950240394209",
      appId: "1:950240394209:web:78d4f2471d2d89ac91f0a0"
    };

    const state = {
      slug: "",
      tenantId: "",
      seedRaw: {},
      liveRaw: {},
      config: null,
      counters: {},
      countersLoaded: false,
      joining: false,
      db: null
    };

    const $ = (id) => document.getElementById(id);

    function showFatal(msg) {
      console.error(msg);
      const el = document.createElement('div');
      el.style = 'background:#fee;padding:12px;color:#900;font-weight:700;position:fixed;left:8px;right:8px;top:8px;z-index:9999;border:1px solid #fca5a5;border-radius:10px';
      el.innerText = 'ERROR: ' + msg;
      document.body ? document.body.prepend(el) : document.documentElement.appendChild(el);
    }

    function showMessage(type, msg, ms = 5000) {
      const el = $("messageBox");
      el.className = `hidden p-3 rounded-lg border text-sm`;
      if (type === "error") {
        el.className = "p-3 bg-red-50 border border-red-200 rounded-lg";
        el.innerHTML = `<p class="text-red-600 text-sm">${escapeHtml(msg)}</p>`;
      } else if (type === "success") {
        el.className = "p-3 bg-green-50 border border-green-200 rounded-lg";
        el.innerHTML = `<p class="text-green-600 text-sm">${escapeHtml(msg)}</p>`;
      } else {
        el.className = "p-3 bg-blue-50 border border-blue-200 rounded-lg";
        el.innerHTML = `<p class="text-blue-700 text-sm">${escapeHtml(msg)}</p>`;
      }
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.className = "hidden p-3 rounded-lg border text-sm";
        el.innerHTML = "";
      }, ms);
    }

    function escapeHtml(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getSlugFromQuery() {
      try {
        const qp = new URLSearchParams(window.location.search);
        const s = qp.get('slug');
        if (s && String(s).trim()) return String(s).trim();
      } catch (e) {}

      try {
        const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        const parts = path.split("/").filter(Boolean);
        if (parts.length > 0 && !parts[0].includes(".")) return parts[0];
      } catch (e) {}

      return null;
    }

    function tenantRefFactory(dbInstance) {
      return function tenantRef(relPath = '') {
        relPath = String(relPath || '').replace(/^\/+/, '');
        const tenantId = window.__TENANT_ID || state.tenantId || null;
        const slug = window.__TENANT_SLUG || state.slug || null;
        if (!tenantId && !slug) throw new Error('tenantRef requires TENANT_ID or TENANT_SLUG to be set');
        const base = tenantId ? `tenants/${tenantId}` : `tenants/${slug}`;
        return relPath ? ref(dbInstance, `${base}/${relPath}`) : ref(dbInstance, base);
      };
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function runTxWithRetries(pathRef, updater, maxRetries = 6) {
      let lastErr = null;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const result = await runTransaction(pathRef, updater, { applyLocally: false });
          if (result && result.committed) return result;
          lastErr = new Error(`Transaction not committed (attempt ${attempt})`);
        } catch (err) {
          lastErr = err;
          console.warn(`[tx] attempt ${attempt} failed`, err);
        }
        const backoff = 100 * Math.pow(2, attempt - 1) + Math.floor(Math.random() * 120);
        await sleep(backoff);
      }
      throw lastErr || new Error('Transaction failed after retries');
    }

    function isVideoUrl(url) {
      return /\.(mp4|webm|ogg)(\?.*)?$/i.test(String(url || '')) || String(url || '').startsWith('data:video/');
    }

    function isImageUrl(url) {
      return /\.(png|jpe?g|gif|svg|webp)(\?.*)?$/i.test(String(url || '')) || String(url || '').startsWith('data:image/');
    }

    function createMediaElement(url, { classes = '', autoplay = false, muted = true, loop = true, playsinline = true } = {}) {
      if (!url) return null;
      if (isVideoUrl(url)) {
        const v = document.createElement('video');
        if (playsinline) v.setAttribute('playsinline', '');
        if (autoplay) v.setAttribute('autoplay', '');
        if (loop) v.setAttribute('loop', '');
        if (muted) v.muted = true;
        v.preload = 'metadata';
        v.src = url;
        v.className = classes || '';
        v.playsInline = !!playsinline;
        v.setAttribute('draggable', 'false');
        return v;
      }
      if (isImageUrl(url)) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'media';
        img.className = classes || '';
        img.setAttribute('draggable', 'false');
        return img;
      }
      const span = document.createElement('span');
      span.textContent = url;
      return span;
    }

    function deepMerge(base = {}, extra = {}) {
      const out = Array.isArray(base) ? [...base] : { ...base };
      for (const [key, val] of Object.entries(extra || {})) {
        if (
          val &&
          typeof val === 'object' &&
          !Array.isArray(val) &&
          out[key] &&
          typeof out[key] === 'object' &&
          !Array.isArray(out[key])
        ) {
          out[key] = deepMerge(out[key], val);
        } else {
          out[key] = val;
        }
      }
      return out;
    }

    function pickCfg(cfg, ...keys) {
      const pick = v => (typeof v === 'string' && v.trim()) ? v.trim() : (typeof v === 'number' || typeof v === 'boolean') ? v : null;
      for (const k of keys) {
        if (!k) continue;
        const parts = k.split('.');
        let cur = cfg;
        for (const p of parts) {
          if (!cur || typeof cur !== 'object') { cur = null; break; }
          cur = cur[p];
        }
        const val = pick(cur);
        if (val !== null) return val;
      }
      return null;
    }

    function normalizeColor(hex, fallback = "#8b5cf6") {
      if (typeof hex !== "string") return fallback;
      const s = hex.trim();
      if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s)) return fallback;
      if (s.length === 4) return "#" + s.slice(1).split("").map(ch => ch + ch).join("");
      return s;
    }

    function shade(hex, amount = 0.12) {
      hex = normalizeColor(hex);
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255;
      let g = (n >> 8) & 255;
      let b = n & 255;
      const mix = (v) => Math.max(0, Math.min(255, Math.round(v)));
      if (amount >= 0) {
        r = mix(r + (255 - r) * amount);
        g = mix(g + (255 - g) * amount);
        b = mix(b + (255 - b) * amount);
      } else {
        r = mix(r * (1 + amount));
        g = mix(g * (1 + amount));
        b = mix(b * (1 + amount));
      }
      return `rgb(${r}, ${g}, ${b})`;
    }

    function normalizeBool(val, defaultValue = true) {
      if (val === undefined || val === null) return defaultValue;
      if (typeof val === 'boolean') return val;
      if (typeof val === 'number') return val !== 0;
      const s = String(val).trim().toLowerCase();
      if (["true", "1", "yes", "y", "on", "active"].includes(s)) return true;
      if (["false", "0", "no", "n", "off", "inactive"].includes(s)) return false;
      return defaultValue;
    }

    function normalizeConfig(raw = {}) {
      const cfg = raw || {};
      return {
        displayName: pickCfg(cfg, 'displayName', 'name', 'siteTitle', 'mainTitle', 'title') || 'Queue Joy',
        smallTextOnTop: pickCfg(cfg, 'smallTextOnTop', 'smallTopText', 'smallTop') || 'Digital Queue System',
        logoUrl: pickCfg(cfg, 'logoUrl', 'logo', 'theme.logo', 'branding.logo') || '',
        centerLogoUrl: pickCfg(cfg, 'centerLogoUrl', 'centerLogo', 'logo') || '',
        theme: {
          color: normalizeColor(
            pickCfg(cfg, 'theme.color', 'themeColor', 'themeColorHex', 'primaryColor'),
            "#8b5cf6"
          )
        },
        mainHeading: pickCfg(cfg, 'mainHeading', 'titleinmiddle', 'titleInMiddle', 'ctaTitle', 'heading') || 'Get your queue number',
        description: pickCfg(cfg, 'description', 'introText', 'subtitle') || 'Real-time queueing system. Mobile-friendly. No app needed.',
        buttonText: pickCfg(cfg, 'buttonText', 'ctaText', 'cta', 'getNumberText') || 'Get your queue number',
        ad: {
          video: pickCfg(cfg, 'ad.video', 'adVideo', 'adVideoUrl') || '',
          image: pickCfg(cfg, 'ad.image', 'adImage', 'adImageUrl') || '',
          link: pickCfg(cfg, 'ad.link', 'adUrl', 'adHref', 'adLink') || ''
        },
        adText: pickCfg(cfg, 'adText', 'ad.text') || '',
        timezone: pickCfg(cfg, 'timezone') || 'UTC'
      };
    }

    function renderLogo(slot, url, fallbackHtml, { hideWhenEmpty = false } = {}) {
      slot.innerHTML = '';
      if (!url) {
        if (hideWhenEmpty) {
          slot.classList.add('hidden');
          return;
        }
        slot.classList.remove('hidden');
        slot.innerHTML = fallbackHtml;
        return;
      }
      const el = createMediaElement(url, { classes: 'logo-media', autoplay: false, muted: true, loop: true });
      if (!el) {
        if (hideWhenEmpty) {
          slot.classList.add('hidden');
          return;
        }
        slot.classList.remove('hidden');
        slot.innerHTML = fallbackHtml;
        return;
      }
      if (el.tagName === 'VIDEO') {
        el.muted = true;
        el.loop = true;
        el.playsInline = true;
        el.preload = 'metadata';
        el.setAttribute('aria-hidden', 'true');
        el.play().catch(() => {});
      }
      slot.classList.remove('hidden');
      slot.appendChild(el);
    }

    function applyTheme(color) {
      const theme = normalizeColor(color, "#8b5cf6");
      document.documentElement.style.setProperty('--theme-color', theme);
      document.documentElement.style.setProperty('--theme-color-dark', shade(theme, -0.18));
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme);

      const btn = $('getNumberBtn');
      btn.style.background = `linear-gradient(135deg, ${theme}, ${shade(theme, 0.20)})`;
      btn.style.boxShadow = `0 16px 30px ${theme}33`;

      const centerFallback = $('centerFallback');
      if (centerFallback) centerFallback.style.background = `linear-gradient(135deg, ${theme}, ${shade(theme, -0.18)})`;
    }

    function setSyncHint(text) {
      const el = $('syncHint');
      if (!el) return;
      el.textContent = text || '';
      el.classList.toggle('hidden', !text);
    }

    function setLoading(flag) {
      state.joining = !!flag;
      const btn = $('getNumberBtn');
      btn.disabled = !!flag;
      btn.classList.toggle('opacity-95', !flag);
      btn.classList.toggle('cursor-wait', !!flag);
      $('btnText').classList.toggle('hidden', flag);
      $('btnSpinner').classList.toggle('hidden', !flag);
      btn.setAttribute('aria-busy', String(!!flag));
    }

    function getActiveCounters() {
      const arr = Object.entries(state.counters || {}).map(([id, v]) => ({
        id,
        ...(v || {}),
        _active: normalizeBool(v?.active, true)
      })).filter(c => c._active);

      arr.sort((a, b) => {
        const ao = Number.isFinite(Number(a.order)) ? Number(a.order) : Number.POSITIVE_INFINITY;
        const bo = Number.isFinite(Number(b.order)) ? Number(b.order) : Number.POSITIVE_INFINITY;
        if (ao !== bo) return ao - bo;
        return String(a.name || a.id).localeCompare(String(b.name || b.id), undefined, { numeric: true, sensitivity: 'base' });
      });

      return arr;
    }

    function updateMetaState() {
      const active = getActiveCounters();
      if (!state.countersLoaded) {
        setSyncHint('Syncing counters...');
      } else if (!active.length) {
        setSyncHint('Counters loaded');
      } else {
        setSyncHint(`${active.length} counters available`);
      }
    }

    function renderConfig() {
      const cfg = state.config || normalizeConfig(state.seedRaw);

      document.title = `${cfg.displayName} - Digital Queue System`;
      $('siteTitle').textContent = cfg.displayName;
      $('smallTopText').textContent = cfg.smallTextOnTop;
      $('mainHeading').textContent = cfg.mainHeading;
      $('introText').textContent = cfg.description;
      $('btnText').textContent = `🎫 ${cfg.buttonText}`;
      $('adText').textContent = cfg.adText || '';
      $('adText').classList.toggle('hidden', !cfg.adText);

      applyTheme(cfg.theme.color);

      renderLogo(
        $('siteLogo'),
        cfg.logoUrl,
        `<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--theme-color)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/>
          </svg>
        </div>`
      );

      const centerLogoEl = $('centerLogo');
      const centerIcon = $('centerIcon');

      if (cfg.centerLogoUrl) {
        renderLogo(
          centerLogoEl,
          cfg.centerLogoUrl,
          `<div class="w-full h-full"></div>`,
          { hideWhenEmpty: false }
        );
        centerIcon.classList.add('hidden');
      } else {
        centerLogoEl.classList.add('hidden');
        centerIcon.classList.remove('hidden');
      }

      const adStage = $('adStage');
      const adAnchor = $('adAnchor');
      const adUrl = cfg.ad.video || cfg.ad.image;
      const adLink = cfg.ad.link;

      if (window.__adObserver) {
        try { window.__adObserver.disconnect(); } catch (e) {}
        window.__adObserver = null;
      }

      adStage.innerHTML = '';
      if (adUrl) {
        const loading = document.createElement('div');
        loading.className = 'loading-skeleton';
        loading.style.width = '100%';
        loading.style.height = '180px';
        loading.style.borderRadius = '18px';
        adStage.appendChild(loading);

        const loadAd = () => {
          adStage.innerHTML = '';
          const media = createMediaElement(adUrl, { classes: 'media-cover', autoplay: true, muted: true, loop: true });
          if (!media) {
            adStage.innerHTML = `
              <div class="ad-empty">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-6-3.46a2 2 0 0 0-2 0l-6 3.46A2 2 0 0 0 5 8v8a2 2 0 0 0 1 1.73l6 3.46a2 2 0 0 0 2 0l6-3.46A2 2 0 0 0 21 16z"/>
                </svg>
                <div>Ad could not be loaded</div>
              </div>`;
            return;
          }

          if (media.tagName === 'VIDEO') {
            media.muted = true;
            media.loop = true;
            media.playsInline = true;
            media.preload = 'metadata';
            media.setAttribute('controls', '');
            media.style.objectFit = 'cover';
            media.addEventListener('error', () => {
              adStage.innerHTML = `<div class="ad-empty"><div>Ad video failed to load</div></div>`;
            });
            media.play().catch(() => {});
          } else {
            media.loading = 'lazy';
            media.style.objectFit = 'cover';
            media.addEventListener('error', () => {
              adStage.innerHTML = `<div class="ad-empty"><div>Ad image failed to load</div></div>`;
            });
          }

          let wrap;
          if (isSafeHttpUrl(adLink)) {
            wrap = document.createElement('a');
            wrap.href = adLink;
            wrap.target = '_blank';
            wrap.rel = 'noopener noreferrer';
          } else {
            wrap = document.createElement('div');
          }

          wrap.style.display = 'block';
          wrap.style.width = '100%';
          wrap.style.height = '100%';
          wrap.appendChild(media);
          adStage.appendChild(wrap);
        };

        if ('IntersectionObserver' in window) {
          const io = new IntersectionObserver((entries, obs) => {
            if (entries.some(e => e.isIntersecting)) {
              obs.disconnect();
              loadAd();
            }
          }, { rootMargin: '160px' });
          io.observe(adStage);
          window.__adObserver = io;
        } else {
          loadAd();
        }

        adAnchor.style.pointerEvents = isSafeHttpUrl(adLink) ? 'auto' : 'none';
      } else {
        adStage.innerHTML = `
          <div class="ad-empty">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-6-3.46a2 2 0 0 0-2 0l-6 3.46A2 2 0 0 0 5 8v8a2 2 0 0 0 1 1.73l6 3.46a2 2 0 0 0 2 0l6-3.46A2 2 0 0 0 21 16z"/>
            </svg>
            <div>No advertisement available</div>
          </div>`;
        adAnchor.removeAttribute('href');
        adAnchor.removeAttribute('target');
        adAnchor.removeAttribute('rel');
        adAnchor.style.pointerEvents = 'none';
      }
    }

    async function resolveTenantAndSeed() {
      state.slug = getSlugFromQuery();
      if (!state.slug) {
        showFatal('Missing slug — open as ?slug=your-tenant-slug');
        return false;
      }
      window.__TENANT_SLUG = state.slug;

      let seedConfig = {};
      try {
        const res = await fetch(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(state.slug)}`, { cache: 'no-store' });
        if (res.ok) {
          const j = await res.json();
          state.tenantId = j.tenantId || j.tenant || state.slug;
          seedConfig = j.config || j.public || {};
        } else {
          state.tenantId = state.slug;
          seedConfig = {};
        }
      } catch (e) {
        state.tenantId = state.slug;
        seedConfig = {};
      }

      window.__TENANT_ID = state.tenantId;
      window.__TENANT_SLUG = state.slug;
      $('slugValue').textContent = state.slug;
      $('tenantValue').textContent = `id:${state.tenantId}`;

      state.seedRaw = seedConfig || {};
      state.config = normalizeConfig(state.seedRaw);
      renderConfig();
      return true;
    }

    async function initFirebase() {
      const app = initializeApp(siteFirebaseConfig);
      state.db = getDatabase(app);
      window._db = state.db;
    }

    async function warmLoadInitialData() {
      try {
        const cfgRef = tenantRefFactory(state.db)('public/config');
        const ctrRef = tenantRefFactory(state.db)('counters');

        const [cfgSnap, ctrSnap] = await Promise.allSettled([get(cfgRef), get(ctrRef)]);

        if (cfgSnap.status === 'fulfilled' && cfgSnap.value && cfgSnap.value.exists && cfgSnap.value.exists()) {
          state.liveRaw = cfgSnap.value.val() || {};
          state.config = normalizeConfig(deepMerge(state.seedRaw, state.liveRaw));
          renderConfig();
        }

        if (ctrSnap.status === 'fulfilled' && ctrSnap.value) {
          state.counters = ctrSnap.value.exists && ctrSnap.value.exists() ? (ctrSnap.value.val() || {}) : {};
          state.countersLoaded = true;
          updateMetaState();
        }
      } catch (e) {
        console.warn('warmLoadInitialData failed', e);
      }
    }

    function subscribeLive() {
      const tenantRef = tenantRefFactory(state.db);

      onValue(tenantRef('public/config'), (snap) => {
        const live = snap && snap.exists && snap.exists() ? (snap.val() || {}) : {};
        state.liveRaw = live;
        state.config = normalizeConfig(deepMerge(state.seedRaw, state.liveRaw));
        renderConfig();
      }, (err) => console.warn('config listener failed', err));

      onValue(tenantRef('counters'), (snap) => {
        state.counters = snap && snap.exists && snap.exists() ? (snap.val() || {}) : {};
        state.countersLoaded = true;
        updateMetaState();
      }, (err) => console.warn('counters listener failed', err));
    }

    function refreshMetaText() {
      if (!state.countersLoaded) {
        $('syncHint').textContent = 'Loading tenant data...';
        return;
      }
      const active = getActiveCounters();
      if (!active.length) {
        $('syncHint').textContent = 'Counters loaded';
      } else {
        $('syncHint').textContent = `${active.length} counters available`;
      }
    }

    function getActiveCounters() {
      const arr = Object.entries(state.counters || {}).map(([id, v]) => ({
        id,
        ...(v || {}),
        _active: normalizeBool(v?.active, true)
      })).filter(c => c._active);

      arr.sort((a, b) => {
        const ao = Number.isFinite(Number(a.order)) ? Number(a.order) : Number.POSITIVE_INFINITY;
        const bo = Number.isFinite(Number(b.order)) ? Number(b.order) : Number.POSITIVE_INFINITY;
        if (ao !== bo) return ao - bo;
        return String(a.name || a.id).localeCompare(String(b.name || b.id), undefined, { numeric: true, sensitivity: 'base' });
      });

      return arr;
    }

    function updateMetaState() {
      refreshMetaText();
    }

    async function warmLoadCountersOnly() {
      try {
        const snap = await get(tenantRefFactory(state.db)('counters'));
        state.counters = snap && snap.exists && snap.exists() ? (snap.val() || {}) : {};
        state.countersLoaded = true;
        updateMetaState();
        return true;
      } catch (e) {
        console.warn('warmLoadCountersOnly failed', e);
        return false;
      }
    }

    async function autoRedirectIfNeeded() {
      try {
        const lastQueueId = sessionStorage.getItem('lastQueueId');
        if (!lastQueueId) return;
        const snap = await get(ref(state.db, `tenants/${state.tenantId}/queue/${lastQueueId}`));
        if (snap.exists() && snap.val()?.status === 'waiting') {
          const target = `${location.origin}/status.html?queueId=${encodeURIComponent(lastQueueId)}&slug=${encodeURIComponent(state.slug)}&tenantId=${encodeURIComponent(state.tenantId)}`;
          location.href = target;
        }
      } catch (e) {
        console.warn('auto redirect check failed', e);
      }
    }

    async function getQueueNumber() {
      if (state.joining) return;

      if (!state.countersLoaded) {
        showMessage('info', 'Syncing counters...');
        $('syncHint').textContent = 'Syncing counters...';
        const ok = await warmLoadCountersOnly();
        if (!ok) {
          showMessage('error', 'Unable to load counters right now.');
          return;
        }
      }

      const activeCounters = getActiveCounters();
      if (!activeCounters.length) {
        showMessage('error', 'No active counters right now. Please ask staff to open a counter.');
        return;
      }

      state.joining = true;
      setLoading(true);
      try {
        const rrRef = ref(state.db, `tenants/${state.tenantId}/queueState/lastCounterIndex`);
        const rrResult = await runTxWithRetries(rrRef, cur => (Number(cur) || 0) + 1, 8);
        if (!rrResult || rrResult.committed !== true) throw new Error('Round-robin transaction failed');
        const rrVal = Number(rrResult.snapshot && rrResult.snapshot.val());
        if (!Number.isFinite(rrVal)) throw new Error('Invalid round-robin value');

        const index = ((rrVal - 1) % activeCounters.length + activeCounters.length) % activeCounters.length;
        const chosen = activeCounters[index] || activeCounters[0];
        if (!chosen) throw new Error('No counter could be selected');

        const lastIssuedRef = ref(state.db, `tenants/${state.tenantId}/counters/${chosen.id}/lastIssued`);
        const lastIssuedTx = await runTxWithRetries(lastIssuedRef, cur => (Number(cur) || 0) + 1, 8);
        if (!lastIssuedTx || lastIssuedTx.committed !== true) throw new Error('Failed to increment counter number');

        const nextNumber = Number(lastIssuedTx.snapshot && lastIssuedTx.snapshot.val());
        if (!Number.isFinite(nextNumber) || nextNumber < 1) throw new Error('Invalid queue number');

        const prefix = String(chosen.prefix || 'Q').trim() || 'Q';
        const queueId = `${prefix}${String(nextNumber).padStart(3, '0')}`;

        const queueRef = push(ref(state.db, `tenants/${state.tenantId}/queue`));
        const now = Date.now();
        await set(queueRef, {
          counterId: chosen.id,
          queueId,
          number: nextNumber,
          prefix,
          timestamp: now,
          createdAt: now,
          updatedAt: now,
          status: 'waiting',
          slug: state.slug,
          tenantId: state.tenantId
        });

        try {
          sessionStorage.setItem('lastQueueId', queueRef.key);
        } catch (e) {}

        showMessage('success', `You're number ${queueId}`);
        setTimeout(() => {
          const target = `${location.origin}/status.html?queueId=${encodeURIComponent(queueRef.key)}&slug=${encodeURIComponent(state.slug)}&tenantId=${encodeURIComponent(state.tenantId)}`;
          location.href = target;
        }, 650);
      } catch (err) {
        console.error('getQueueNumber error', err);
        showMessage('error', err?.message || 'Failed to get queue number.');
      } finally {
        state.joining = false;
        setLoading(false);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const slug = getSlugFromQuery();
      if (!slug) {
        showFatal('Missing slug — open as ?slug=your-tenant-slug');
        return;
      }

      $('getNumberBtn').disabled = false;
      $('syncHint').textContent = 'Loading tenant data...';

      if (!(await resolveTenantAndSeed())) return;
      await initFirebase();

      warmLoadInitialData();   // fire-and-forget for speed
      subscribeLive();         // live updates
      await autoRedirectIfNeeded();

      updateMetaState();
      setTimeout(() => {
        if (!state.countersLoaded) $('syncHint').textContent = 'Syncing counters...';
      }, 250);

      $('getNumberBtn').addEventListener('click', e => {
        e.preventDefault();
        getQueueNumber();
      });

      // keep ad links safe but allow valid http(s) links
      $('adAnchor').addEventListener('click', (ev) => {
        const href = $('adAnchor').getAttribute('href') || '';
        if (!href) {
          ev.preventDefault();
          return;
        }
        try {
          const u = new URL(href, location.href);
          if (!(u.protocol === 'http:' || u.protocol === 'https:')) ev.preventDefault();
        } catch {
          ev.preventDefault();
        }
      });
    });

    window.getQueueNumber = getQueueNumber;
  </script>
</head>
