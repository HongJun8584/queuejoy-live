<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queue Joy - Digital Queue System</title>

  <!-- Tailwind (dev) + font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --card-radius: 1rem; --theme-color: #8b5cf6; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .fade-in { animation: fadeIn 0.45s cubic-bezier(.2,.9,.2,1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    .db-image { max-height: 180px; object-fit: cover; }
    /* QA badge */
    #tenant-slug-badge{position:fixed;right:12px;bottom:12px;background:var(--theme-color);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;z-index:9999;opacity:.95}
    #tenant-slug-badge small{opacity:.9;font-weight:600}
  </style>

  <!-- Firebase v10 (module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      child,
      push,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // --- Site-wide Firebase client config (shared project)
    const siteFirebaseConfig = {
      apiKey: "AIzaSyDiRGvkQbnLlpnJT3fEEQrY1A3nwLVIFY0",
      authDomain: "queue-joy-aa21b.firebaseapp.com",
      databaseURL: "https://queue-joy-aa21b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "queue-joy-aa21b",
      storageBucket: "queue-joy-aa21b.appspot.com",
      messagingSenderId: "950240394209",
      appId: "1:950240394209:web:78d4f2471d2d89ac91f0a0"
    };

    // ---------- Utility helpers ----------
    function showFatal(msg) {
      console.error(msg);
      const el = document.createElement('div');
      el.style = 'background:#fee;padding:12px;color:#900;font-weight:700;position:fixed;left:8px;right:8px;top:8px;z-index:9999';
      el.innerText = 'ERROR: ' + msg;
      document.body ? document.body.prepend(el) : document.documentElement.appendChild(el);
    }

    function getSlugFromQuery() {
      try {
        const qp = new URLSearchParams(window.location.search);
        const s = qp.get('slug');
        return s ? String(s).trim() : null;
      } catch (e) { return null; }
    }

    function tenantRefFactory(dbInstance) {
      return function tenantRef(relPath = '') {
        relPath = String(relPath || '').replace(/^\/+/, '');
        const tenantId = window.__TENANT_ID || null;
        const slug = window.__TENANT_SLUG || null;
        if (!tenantId && !slug) {
          return ref(dbInstance, relPath || '/');
        }
        const base = tenantId ? `tenants/${tenantId}` : `tenants/${slug}`;
        if (!relPath) return ref(dbInstance, base);
        return ref(dbInstance, `${base}/${relPath}`);
      };
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function runTxWithRetries(pathRef, updater, maxRetries = 6) {
      let lastErr = null;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const result = await runTransaction(pathRef, updater, { applyLocally: false });
          if (result && result.committed) return result;
          lastErr = new Error(`Transaction not committed (attempt ${attempt})`);
        } catch (err) {
          lastErr = err;
          console.warn(`[tx] attempt ${attempt} failed`, err);
        }
        const backoff = 100 * Math.pow(2, attempt - 1) + Math.floor(Math.random() * 120);
        await sleep(backoff);
      }
      throw lastErr || new Error('Transaction failed after retries');
    }

    // ---------- Startup: resolve slug -> tenantId, init Firebase, boot ----------
    document.addEventListener('DOMContentLoaded', async () => {
      // DOM refs
      const siteTitleEl = document.getElementById('siteTitle');
      const siteLogoEl = document.getElementById('siteLogo');
      const centerLogoImg = document.getElementById('centerLogo');
      const centerIcon = document.getElementById('centerIcon');
      const mainHeading = document.getElementById('mainHeading');
      const introText = document.getElementById('introText');
      const getNumberBtn = document.getElementById('getNumberBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const adLinkEl = document.getElementById('adLink');
      const adTextEl = document.getElementById('adText');
      const noAd = document.getElementById('noAd');
      const smallTopTextEl = document.getElementById('smallTopText');
      const adContainer = document.getElementById('adContainer');

      // extract slug from ?slug= only (explicit)
      const slug = getSlugFromQuery();
      if (!slug) {
        showFatal('Missing slug — please open the page with ?slug=your-tenant-slug');
        return;
      }
      window.__TENANT_SLUG = slug;

      // show QA badge
      (function insertBadge() {
        const badge = document.createElement('div');
        badge.id = 'tenant-slug-badge';
        badge.innerHTML = `<small>slug</small> <span id="tenant-slug-value" style="font-weight:700;margin-left:6px">${slug}</span> <span id="tenant-id-value" style="margin-left:8px;font-size:11px;opacity:.9"></span>`;
        document.body.appendChild(badge);
      })();

      // Resolve tenant via Netlify function
      let tenantId = null;
      let tenantPublicConfig = null;
      try {
        const res = await fetch(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(slug)}`, { cache: 'no-store' });
        if (!res.ok) {
          const txt = await res.text().catch(()=>null);
          showFatal(`Tenant lookup failed (${res.status}): ${txt || res.statusText}`);
          return;
        }
        const j = await res.json();
        tenantId = j.tenantId || null;
        tenantPublicConfig = j.config || j.public || null;
        if (!tenantId && tenantPublicConfig && tenantPublicConfig.tenantId) tenantId = tenantPublicConfig.tenantId;
        if (!tenantId) tenantId = slug; // fallback legacy
        window.__TENANT_ID = tenantId;
        window.__TENANT_PUBLIC_CONFIG = tenantPublicConfig || {};
        const idSpan = document.getElementById('tenant-id-value');
        if (idSpan) idSpan.textContent = `id:${tenantId}`;
      } catch (e) {
        showFatal('Failed to resolve tenant: ' + String(e && e.message ? e.message : e));
        return;
      }

      // Initialize Firebase client
      let app, db;
      try {
        app = initializeApp(siteFirebaseConfig);
        db = getDatabase(app);
        window._db = db; // debug hook
      } catch (e) {
        showFatal('Failed to initialize Firebase client: ' + String(e && e.message ? e.message : e));
        return;
      }

      const tenantRef = tenantRefFactory(db);

      // Apply public config to UI (if present)
      try {
        const cfg = window.__TENANT_PUBLIC_CONFIG || {};
        if (cfg.theme && cfg.theme.color) {
          document.documentElement.style.setProperty('--theme-color', cfg.theme.color);
        }
        const title = (cfg.displayName) ? String(cfg.displayName) : null;
        if (title) {
          siteTitleEl.textContent = title;
          document.title = `${title} - Digital Queue System`;
        }
      } catch (e) { /* non-fatal */ }

      // UI helpers
      function showError(msg) {
        console.warn(msg);
        try { errorMessage.querySelector('p').textContent = msg; errorMessage.classList.remove('hidden'); successMessage.classList.add('hidden'); setTimeout(()=>errorMessage.classList.add('hidden'),6000); } catch(e){}
      }
      function showSuccess(msg) {
        try { successMessage.querySelector('p').textContent = msg; successMessage.classList.remove('hidden'); errorMessage.classList.add('hidden'); setTimeout(()=>successMessage.classList.add('hidden'),6000); } catch(e){}
      }
      function setLoading(flag) {
        getNumberBtn.disabled = flag;
        btnText.classList.toggle('hidden', flag);
        btnSpinner.classList.toggle('hidden', !flag);
        getNumberBtn.setAttribute('aria-busy', String(flag));
      }

      // Settings listener (tenant-aware)
      const settingsRef = tenantRef('public/config');
      onValue(settingsRef, snap => {
        const s = snap && typeof snap.val === 'function' ? (snap.exists() ? snap.val() : {}) : {};
        const pick = v => (typeof v === 'string' && v.trim()) ? v.trim() : (typeof v === 'number' || typeof v === 'boolean') ? v : null;

        if (s && s.logo) { siteLogoEl.src = s.logo; siteLogoEl.classList.remove('hidden'); } else { siteLogoEl.src = ''; siteLogoEl.classList.add('hidden'); }

        const topTitle = pick(s.displayName) || pick(s.mainTitle) || pick(s.name) || 'Queue Joy';
        siteTitleEl.textContent = topTitle;
        document.title = topTitle + ' - Digital Queue System';

        if (smallTopTextEl) smallTopTextEl.textContent = pick(s.smallTextOnTop) || pick(s.smallTopText) || 'Digital Queue System';

        if (s.logoUrl) {
          centerLogoImg.src = s.logoUrl; centerLogoImg.classList.remove('hidden'); centerIcon.classList.add('hidden');
        } else if (s.logo) {
          centerLogoImg.src = s.logo; centerLogoImg.classList.remove('hidden'); centerIcon.classList.add('hidden');
        } else {
          centerLogoImg.src = ''; centerLogoImg.classList.add('hidden'); centerIcon.classList.remove('hidden');
        }

        mainHeading.textContent = pick(s.titleinmiddle) || pick(s.ctaTitle) || 'Get your queue number';
        introText.textContent = pick(s.introText) || pick(s.smallTextOnTop) || 'Real-time queueing system. Mobile-friendly. No app needed.';
        btnText.textContent = '🎫 ' + (pick(s.ctaText) || 'Get your queue number');

        // ad handling
        adContainer.innerHTML = '';
        if (s.adImage) {
          const url = String(s.adImage).trim();
          const isVideo = /\.(mp4|webm|ogg)(\?.*)?$/i.test(url) || url.startsWith('data:video/');
          if (isVideo) {
            const videoEl = document.createElement('video');
            videoEl.setAttribute('playsinline','');
            videoEl.setAttribute('autoplay','');
            videoEl.setAttribute('loop','');
            videoEl.setAttribute('muted','');
            videoEl.setAttribute('preload','metadata');
            videoEl.className = 'w-full object-cover db-image';
            videoEl.src = url;
            adContainer.appendChild(videoEl);
            videoEl.play().catch(()=>videoEl.setAttribute('controls',''));
          } else {
            const imgEl = document.createElement('img');
            imgEl.src = url;
            imgEl.alt = 'Advertisement';
            imgEl.className = 'w-full object-cover db-image';
            adContainer.appendChild(imgEl);
          }
          adContainer.classList.remove('hidden');
          noAd.classList.add('hidden');
        } else {
          adContainer.innerHTML = '';
          adContainer.classList.add('hidden');
          noAd.classList.remove('hidden');
        }
        adTextEl.textContent = pick(s.adText) || '';
        adTextEl.classList.toggle('hidden', !adTextEl.textContent);

      }, err => {
        console.warn('settings read failed', err);
        showError('Failed to read tenant settings.');
      });

      // Auto-redirect if lastQueueId still waiting — preserve slug
      (async function autoRedirect() {
        try {
          const lastQueueId = sessionStorage.getItem('lastQueueId');
          if (!lastQueueId) return;
          // check both tenant-scoped and legacy global
          const snap = await get(child(tenantRef('queue'), lastQueueId));
          if (snap && snap.exists && snap.val() && snap.val().status === 'waiting') {
            const target = `status.html?queueId=${encodeURIComponent(lastQueueId)}&slug=${encodeURIComponent(slug)}&tenantId=${encodeURIComponent(tenantId)}`;
            console.info('Auto-redirecting to local status page ->', target);
            window.location.href = target;
          }
        } catch (e) {
          console.warn('autoRedirect check failed', e);
        }
      })();

      // Fetch active counters
      async function fetchActiveCounters() {
        const snap = await get(tenantRef('counters'));
        if (!snap.exists()) return [];
        const raw = [];
        snap.forEach(s => {
          const val = s.val() || {};
          const activeRaw = val.active;
          const active =
            activeRaw === undefined ||
            activeRaw === null ||
            activeRaw === true ||
            activeRaw === 'true' ||
            activeRaw === 1 ||
            activeRaw === '1' ||
            String(activeRaw).toLowerCase() === 'yes' ||
            String(activeRaw).toLowerCase() === 'y';
          raw.push({ id: s.key, ...val, _active: !!active });
        });
        const activeList = raw.filter(c => c && c._active);
        activeList.sort((a, b) => {
          const ao = (a.order !== undefined && a.order !== '' && a.order !== null) ? Number(a.order) : Number.POSITIVE_INFINITY;
          const bo = (b.order !== undefined && b.order !== '' && b.order !== null) ? Number(b.order) : Number.POSITIVE_INFINITY;
          if (ao !== bo) return ao - bo;
          const ai = a.id, bi = b.id;
          if (!isNaN(Number(ai)) && !isNaN(Number(bi))) return Number(ai) - Number(bi);
          return String(ai).localeCompare(String(bi), undefined, { numeric: true, sensitivity: 'base' });
        });
        return activeList;
      }

      // Core: getQueueNumber
      async function getQueueNumber() {
        setLoading(true);
        try {
          const activeCounters = await fetchActiveCounters();
          console.debug('Active counters:', activeCounters.map(c => ({ id: c.id, order: c.order, active: c._active })));
          if (!activeCounters || activeCounters.length === 0) {
            showError('No active counters available right now.');
            return;
          }

          // round-robin index (atomic)
          const rrRef = tenantRef('settings/lastCounterIndex');
          const rrResult = await runTxWithRetries(rrRef, cur => {
            const ncur = Number(cur) || 0;
            return ncur + 1;
          }, 8);

          if (!rrResult || rrResult.committed !== true) {
            throw new Error('Round-robin transaction failed to commit.');
          }

          const rrVal = rrResult.snapshot && rrResult.snapshot.val();
          const globalCounter = Number(rrVal);
          if (!Number.isFinite(globalCounter)) {
            throw new Error('Invalid round-robin counter value returned.');
          }

          const n = activeCounters.length;
          const index = ((globalCounter - 1) % n + n) % n;
          let chosen = activeCounters[index];
          if (!chosen) {
            console.warn('Round-robin: chosen counter missing for index, falling back to first active counter', { globalCounter, index, n });
            chosen = activeCounters[0];
          }

          console.info('Round-robin selected:', { globalCounter, index, chosenId: chosen.id });

          // increment per-counter lastIssued
          const lastIssuedRef = tenantRef(`counters/${chosen.id}/lastIssued`);
          const lastIssuedTx = await runTxWithRetries(lastIssuedRef, cur => (Number(cur) || 0) + 1, 8);
          if (!lastIssuedTx || lastIssuedTx.committed !== true) {
            throw new Error('Failed to increment counter issued number.');
          }

          const nextNumber = Number(lastIssuedTx.snapshot && lastIssuedTx.snapshot.val());
          if (!Number.isFinite(nextNumber)) throw new Error('Invalid nextNumber from counter transaction.');

          const prefix = (chosen.prefix && String(chosen.prefix)) || 'Q';
          const queueId = `${prefix}${String(nextNumber).padStart(3, '0')}`;

          // push queue entry (use push key as the queueKey that status.html expects)
          const newNode = push(tenantRef('queue'));
          await set(newNode, {
            counterId: chosen.id,
            queueId,
            timestamp: Date.now(),
            status: 'waiting'
          });

          // persist lastQueueId and slug for auto-redirect
          try {
            sessionStorage.setItem('lastQueueId', newNode.key);
            sessionStorage.setItem('lastTenantSlug', slug);
          } catch (e) { /* ignore */ }

          showSuccess(`You're number ${queueId}`);

          // important: redirect using the RTDB push key (newNode.key) and include slug and tenantId
          setTimeout(() => {
            const target = `status.html?queueId=${encodeURIComponent(newNode.key)}&slug=${encodeURIComponent(slug)}&tenantId=${encodeURIComponent(tenantId)}`;
            console.info('Redirecting to status page ->', target);
            window.location.href = target;
          }, 750);

        } catch (err) {
          console.error('getQueueNumber error', err);
          showError(err && err.message ? err.message : 'Failed to get queue number. Try again.');
        } finally {
          setLoading(false);
        }
      }

      // Prevent accidental external navigation via ad link
      adLinkEl.addEventListener('click', (ev) => {
        const href = adLinkEl.getAttribute('href') || '';
        if (!href || href === '#') { ev.preventDefault(); return; }
        try {
          const u = new URL(href, window.location.href);
          if (u.origin !== window.location.origin) {
            ev.preventDefault();
            console.warn('Blocked external navigation to', href);
          }
        } catch (e) {
          ev.preventDefault();
        }
      });

      // wire button
      getNumberBtn.addEventListener('click', e => { e.preventDefault(); getQueueNumber(); });

    }); // DOMContentLoaded end
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-rose-50 flex flex-col items-center p-6 pb-20">

  <!-- Header -->
  <header class="w-full max-w-3xl mb-6">
    <div class="bg-white rounded-2xl shadow-md p-4 flex items-center gap-4">
      <img id="siteLogo" src="" alt="Site logo" class="w-12 h-12 rounded-full hidden object-cover border" />
      <div class="flex-1 text-left">
        <h1 id="siteTitle" class="text-lg font-bold text-gray-800">Queue Joy</h1>
        <p id="smallTopText" class="text-xs text-gray-500">Digital Queue System</p>
      </div>
      <div class="text-right text-xs text-gray-400">Powered by Queue Joy</div>
    </div>
  </header>

  <!-- Main -->
  <main class="w-full max-w-3xl flex flex-col items-center gap-8">
    <section class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6 text-center fade-in relative">
      <div class="mx-auto">
        <img id="centerLogo" class="w-20 h-20 rounded-full object-cover hidden mx-auto shadow-sm border" alt="center logo"/>
        <div id="centerIcon" class="w-20 h-20 bg-gradient-to-r from-purple-600 to-indigo-500 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
          </svg>
        </div>
      </div>

      <div class="space-y-2">
        <h2 id="mainHeading" class="text-2xl font-bold text-gray-800">Get your queue number</h2>
        <p id="introText" class="text-gray-600">Real-time queueing system. Mobile-friendly. No app needed.</p>
      </div>

      <button id="getNumberBtn" class="w-full py-4 bg-gradient-to-r from-purple-600 to-purple-400 text-white font-semibold rounded-2xl shadow-lg hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
        <span id="btnText">🎫 Get your queue number</span>
        <span id="btnSpinner" class="hidden inline-flex items-center ml-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          Getting your number...
        </span>
      </button>

      <div id="errorMessage" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg"><p class="text-red-600 text-sm"></p></div>
      <div id="successMessage" class="hidden p-3 bg-green-50 border border-green-200 rounded-lg"><p class="text-green-600 text-sm"></p></div>
    </section>

    <!-- Advertisement card -->
    <aside class="w-full max-w-md bg-white rounded-xl shadow-lg p-3">
      <p class="text-xs text-gray-500 text-center mb-2">Advertisement</p>
      <a id="adLink" href="#" class="block relative">
        <div id="adContainer" class="w-full rounded-lg shadow-md overflow-hidden">
          <!-- ad content (img/video) will be injected here dynamically -->
        </div>
      </a>
      <div id="noAd" class="text-center text-gray-400 text-sm py-6">No advertisement available</div>
      <div id="adText" class="text-xs text-gray-600 text-center mt-2 hidden"></div>
    </aside>
  </main>
</body>
</html>
