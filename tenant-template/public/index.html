<!doctype html>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queue Joy - Digital Queue System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --card-radius: 1rem; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .fade-in { animation: fadeIn 0.45s cubic-bezier(.2,.9,.2,1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    .db-image { max-height: 180px; object-fit: cover; }

</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-rose-50 flex flex-col items-center p-6 pb-20">

  <header class="w-full max-w-3xl mb-6">
    <div class="bg-white rounded-2xl shadow-md p-4 flex items-center gap-4">
      <img id="siteLogo" src="" alt="Site logo" class="w-12 h-12 rounded-full hidden object-cover border" />
      <div class="flex-1 text-left">
        <h1 id="siteTitle" class="text-lg font-bold text-gray-800">Queue Joy</h1>
        <p id="smallTopText" class="text-xs text-gray-500">Digital Queue System</p>
      </div>
      <div class="text-right text-xs text-gray-400">Powered by Queue Joy</div>
    </div>
  </header>

  <main class="w-full max-w-3xl flex flex-col items-center gap-8">
    <section class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6 text-center fade-in relative">
      <div class="mx-auto">
        <img id="centerLogo" class="w-20 h-20 rounded-full object-cover hidden mx-auto shadow-sm border" alt="center logo"/>
        <div id="centerIcon" class="w-20 h-20 bg-gradient-to-r from-purple-600 to-indigo-500 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
          </svg>
        </div>
      </div>

      <div class="space-y-2">
        <h2 id="mainHeading" class="text-2xl font-bold text-gray-800">Get your queue number</h2>
        <p id="introText" class="text-gray-600">Real-time queueing system. Mobile-friendly. No app needed.</p>
      </div>

      <button id="getNumberBtn" class="w-full py-4 bg-gradient-to-r from-purple-600 to-purple-400 text-white font-semibold rounded-2xl shadow-lg hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
        <span id="btnText">🎫 Get your queue number</span>
        <span id="btnSpinner" class="hidden inline-flex items-center ml-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          Getting your number...
        </span>
      </button>

      <div id="errorMessage" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg"><p class="text-red-600 text-sm"></p></div>
      <div id="successMessage" class="hidden p-3 bg-green-50 border border-green-200 rounded-lg"><p class="text-green-600 text-sm"></p></div>
    </section>

    <aside class="w-full max-w-md bg-white rounded-xl shadow-lg p-3">
      <p class="text-xs text-gray-500 text-center mb-2">Advertisement</p>
      <a id="adLink" href="#" class="block relative">
        <div id="adContainer" class="w-full rounded-lg shadow-md overflow-hidden">
        </div>
      </a>
      <div id="noAd" class="text-center text-gray-400 text-sm py-6">No advertisement available</div>
      <div id="adText" class="text-xs text-gray-600 text-center mt-2 hidden"></div>
    </aside>
  </main>

  <script type="module">
    // index.html — no bootstrap required
    // Behavior:
    // 1) resolve tenant slug from path or ?slug=
    // 2) call /.netlify/functions/get-tenant?slug=SLUG to obtain tenantId and public config
    // 3) call /.netlify/functions/get-firebase-config?slug=SLUG to get client firebase config
    // 4) initialize Firebase client and expose tenantRef / runTxWithRetries scoped to tenants/{tenantId}/
    // 5) read/write realtime DB only under tenants/{tenantId}/

    // --- Helpers ---
    function $(id){ return document.getElementById(id); }
    const siteTitleEl = $('siteTitle');
    const siteLogoEl = $('siteLogo');
    const centerLogoImg = $('centerLogo');
    const centerIcon = $('centerIcon');
    const mainHeading = $('mainHeading');
    const introText = $('introText');
    const getNumberBtn = $('getNumberBtn');
    const btnText = $('btnText');
    const btnSpinner = $('btnSpinner');
    const errorMessage = $('errorMessage');
    const successMessage = $('successMessage');
    const adLinkEl = $('adLink');
    const adTextEl = $('adText');
    const noAd = $('noAd');
    const adContainer = $('adContainer');

    function showError(msg){ console.warn(msg); errorMessage.querySelector('p').textContent = msg; errorMessage.classList.remove('hidden'); successMessage.classList.add('hidden'); setTimeout(()=>errorMessage.classList.add('hidden'),6000); }
    function showSuccess(msg){ successMessage.querySelector('p').textContent = msg; successMessage.classList.remove('hidden'); errorMessage.classList.add('hidden'); setTimeout(()=>successMessage.classList.add('hidden'),6000); }
    function setLoading(flag){ getNumberBtn.disabled = flag; btnText.classList.toggle('hidden', flag); btnSpinner.classList.toggle('hidden', !flag); getNumberBtn.setAttribute('aria-busy', String(flag)); }

    function getSlugFromPath(){
      try{
        const qp = new URL(location.href).searchParams;
        if (qp.get('slug')) return qp.get('slug');
      }catch(e){}
      const parts = (location.pathname||'/').split('/').filter(Boolean);
      // If first path part looks like a filename (contains a dot) treat it as no-slug
      if (parts.length>0 && !parts[0].includes('.')) return parts[0];
      return 'template-demo';
    }

    const SLUG = getSlugFromPath();
    let TENANT_ID = null;
    let FB_CONFIG = null;
    let firebaseApp = null;
    let firebaseDB = null;
    let dbModules = null; // will hold imported firebase database module

    // --- Network helpers ---
    async function fetchJson(url, opts={}){
      const res = await fetch(url, opts);
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        throw new Error(`Fetch failed ${res.status} ${res.statusText}: ${text || ''}`);
      }
      return await res.json();
    }

    // 1) fetch public tenant info
    async function fetchTenantPublic(slug){
      try{
        return await fetchJson(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(slug)}`);
      }catch(e){ console.warn('get-tenant failed', e); return null; }
    }

    // 2) fetch firebase client config for this tenant
    async function fetchFirebaseClientConfig(slug){
      try{
        return await fetchJson(`/.netlify/functions/get-firebase-config?slug=${encodeURIComponent(slug)}`);
      }catch(e){ console.warn('get-firebase-config failed', e); return null; }
    }

    // --- Firebase init and tenantRef helpers ---
    async function initFirebaseAndExpose(cfg, tenantId){
      // load modular firebase client libs dynamically
      const modApp = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      dbModules = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
      firebaseApp = modApp.initializeApp(cfg);
      firebaseDB = dbModules.getDatabase(firebaseApp);

      // tenantRef factory — scoped to tenants/{tenantId}/
      window.tenantRef = function(relPath=''){
        relPath = String(relPath||'').replace(/^\/+/, '');
        const full = `tenants/${tenantId}/${relPath}`.replace(/\/+$/,'');
        const ref = dbModules.ref(firebaseDB, full);
        // return a small helper object matching your previous expectations
        return {
          _path: full,
          async get(){ const snap = await dbModules.get(ref); return snap && snap.exists ? snap.val() : null; },
          onValue(cb){ const unsub = dbModules.onValue(ref, s => cb(s.val())); return unsub; },
          off(unsub){ if (typeof unsub === 'function') unsub(); },
          async set(v){ return await dbModules.set(ref, v); },
          async update(obj){ return await dbModules.update(ref, obj); },
          async push(v){ const p = dbModules.push(ref); await dbModules.set(p, v); return { key: p.key, val: v }; },
          async onceValue(){ const s = await dbModules.get(ref); return { exists: ()=> !!(s && s.exists && s.exists()), val: ()=> s ? s.val() : null } }
        };
      };

      // runTxWithRetries — runs a runTransaction on a tenant-scoped path
      window.runTxWithRetries = async function(pathOrRef, updater, maxRetries=6){
        const path = (typeof pathOrRef === 'string') ? `tenants/${tenantId}/${pathOrRef.replace(/^\/+/, '')}` : (pathOrRef && pathOrRef._path) || null;
        const ref = path ? dbModules.ref(firebaseDB, path) : (pathOrRef && pathOrRef._ref) || null;
        if (!ref) throw new Error('Invalid ref for transaction');
        for (let attempt=1; attempt<=maxRetries; attempt++){
          try{
            const res = await dbModules.runTransaction(ref, current => updater(current), { applyLocally: false });
            if (res && res.committed) return res;
          }catch(e){ console.warn('[tx] attempt', attempt, 'failed', e); }
          await new Promise(r => setTimeout(r, 100 * Math.pow(2, attempt-1) + Math.floor(Math.random()*120)));
        }
        throw new Error('Transaction failed after retries');
      };

      // small convenience: tenantId and fb config on window for debugging
      window.__TENANT__ = window.__TENANT__ || {};
      window.__TENANT__.tenantId = tenantId;
      window.__TENANT__.firebaseClientConfig = cfg;
      window.__TENANT__._supportsRealtime = true;
    }

    // --- UI wiring using tenantRef ---
    async function applySettingsFromTenant(){
      try{
        const settingsRef = window.tenantRef('public/config') || window.tenantRef('settings');
        const snap = await (settingsRef.get ? settingsRef.get() : (await settingsRef.onceValue()).val());
        const s = snap || {};
        const pick = v => (typeof v === 'string' && v.trim()) ? v.trim() : (typeof v === 'number' || typeof v === 'boolean') ? v : null;
        if (s.logo || s.logoUrl){ siteLogoEl.src = s.logoUrl || s.logo; siteLogoEl.classList.remove('hidden'); } else { siteLogoEl.classList.add('hidden'); }
        const topTitle = pick(s.mainTitle) || pick(s.name) || 'Queue Joy';
        siteTitleEl.textContent = topTitle; document.title = topTitle + ' - Digital Queue System';
        mainHeading.textContent = pick(s.titleinmiddle) || 'Get your queue number';
        introText.textContent = pick(s.introText) || 'Real-time queueing system. Mobile-friendly. No app needed.';
        btnText.textContent = '🎫 ' + (pick(s.ctaText) || 'Get your queue number');

        // ad
        adContainer.innerHTML = '';
        if (s.adImage){
          const url = String(s.adImage).trim();
          const isVideo = /\.(mp4|webm|ogg)(?:[?#].*)?$/i.test(url) || url.startsWith('data:video/');
          if (isVideo){ const video = document.createElement('video'); video.className='w-full object-cover db-image'; video.src = url; video.muted = true; video.autoplay = true; video.loop = true; video.setAttribute('playsinline',''); adContainer.appendChild(video); video.play().catch(()=>{}); }
          else { const img = document.createElement('img'); img.src=url; img.alt='Ad'; img.className='w-full object-cover db-image'; adContainer.appendChild(img); }
          adContainer.classList.remove('hidden'); noAd.classList.add('hidden');
        } else { adContainer.classList.add('hidden'); noAd.classList.remove('hidden'); }

        adTextEl.textContent = pick(s.adText) || ''; adTextEl.classList.toggle('hidden', !adTextEl.textContent);
      }catch(e){ console.warn('applySettingsFromTenant failed', e); }
    }

    async function fetchActiveCounters(){
      try{
        const cSnap = await (window.tenantRef('counters').get ? window.tenantRef('counters').get() : (await window.tenantRef('counters').onceValue()).val());
        const obj = cSnap || {};
        const raw = [];
        Object.keys(obj).forEach(k => { const val = obj[k]; const activeRaw = val && val.active; const active = activeRaw === undefined || activeRaw === null || activeRaw === true || activeRaw === 'true' || activeRaw === 1 || activeRaw === '1' || String(activeRaw).toLowerCase()==='yes'; raw.push({ id:k, ...val, _active:!!active }); });
        const activeList = raw.filter(c=>c && c._active);
        activeList.sort((a,b)=>{ const ao=(a.order!==undefined&&a.order!==''&&a.order!==null)?Number(a.order):Number.POSITIVE_INFINITY; const bo=(b.order!==undefined&&b.order!==''&&b.order!==null)?Number(b.order):Number.POSITIVE_INFINITY; if (ao!==bo) return ao-bo; if(!isNaN(Number(a.id)) && !isNaN(Number(b.id))) return Number(a.id)-Number(b.id); return String(a.id).localeCompare(String(b.id), undefined, { numeric:true, sensitivity:'base' }); });
        return activeList;
      }catch(e){ console.warn('fetchActiveCounters failed', e); return []; }
    }

    async function getQueueNumber(){
      setLoading(true);
      try{
        const activeCounters = await fetchActiveCounters();
        if (!activeCounters || activeCounters.length===0){ showError('No active counters available right now.'); return; }

        // runTxWithRetries on settings/lastCounterIndex
        const rrPath = 'queueMeta/lastCounterIndex';
        const rrResult = await window.runTxWithRetries(rrPath, cur => { const ncur = Number(cur) || 0; return ncur + 1; }, 8);
        if (!rrResult || rrResult.committed!==true) throw new Error('Round-robin transaction failed to commit.');
        const rrVal = rrResult.snapshot && (typeof rrResult.snapshot.val==='function' ? rrResult.snapshot.val() : rrResult.snapshot);
        const globalCounter = Number(rrVal);
        if (!Number.isFinite(globalCounter)) throw new Error('Invalid round-robin counter value returned.');

        const n = activeCounters.length; const index = ((globalCounter-1) % n + n) % n; let chosen = activeCounters[index] || activeCounters[0];

        const lastIssuedPath = `counters/${chosen.id}/lastIssued`;
        const lastIssuedTx = await window.runTxWithRetries(lastIssuedPath, cur => (Number(cur) || 0) + 1, 8);
        if (!lastIssuedTx || lastIssuedTx.committed!==true) throw new Error('Failed to increment counter issued number.');
        const nextNumber = Number(lastIssuedTx.snapshot && (typeof lastIssuedTx.snapshot.val==='function' ? lastIssuedTx.snapshot.val() : lastIssuedTx.snapshot));
        const prefix = (chosen.prefix && String(chosen.prefix)) || 'Q';
        const queueId = `${prefix}${String(nextNumber).padStart(3,'0')}`;

        // push queue entry
        const newNode = await window.tenantRef('queue').push({ counterId: chosen.id, queueId, timestamp: Date.now(), status: 'waiting' });
        const newKey = newNode && (newNode.key || (newNode.name || null));
        try{ if (newKey) sessionStorage.setItem('lastQueueId', newKey); }catch(e){}

        showSuccess(`You're number ${queueId}`);
        setTimeout(()=>{ const target = `status.html?queueId=${encodeURIComponent(newKey || '')}`; window.location.href = target; }, 750);

      }catch(err){ console.error('getQueueNumber error', err); showError(err && err.message ? err.message : 'Failed to get queue number.'); }
      finally{ setLoading(false); }
    }

    // auto-redirect if lastQueueId still waiting
    async function autoRedirect(){
      try{
        const lastQueueId = sessionStorage.getItem('lastQueueId'); if (!lastQueueId) return;
        const snap = await (window.tenantRef(`queue/${lastQueueId}`).get ? window.tenantRef(`queue/${lastQueueId}`).get() : (await window.tenantRef(`queue/${lastQueueId}`).onceValue()).val());
        const status = snap && (snap.status || (typeof snap.val==='function' ? snap.val().status : null)); if (status==='waiting') { window.location.href = `status.html?queueId=${encodeURIComponent(lastQueueId)}`; }
      }catch(e){ console.warn('autoRedirect check failed', e); }
    }

    // main init sequence
    (async function init(){
      try{
        // 1) get tenant public info
        const tenantPublic = await fetchTenantPublic(SLUG);
        if (tenantPublic && tenantPublic.tenantId) TENANT_ID = tenantPublic.tenantId;

        // 2) fetch firebase client config for this slug
        const fb = await fetchFirebaseClientConfig(SLUG);
        if (!fb) throw new Error('Missing firebase client config for tenant. Ensure /.netlify/functions/get-firebase-config is implemented.');
        // fb should contain { tenantId?, databaseURL, apiKey, authDomain, projectId, appId }
        if (!TENANT_ID && fb.tenantId) TENANT_ID = fb.tenantId;
        if (!TENANT_ID) throw new Error('Tenant ID not discovered. Ensure get-tenant or get-firebase-config returns tenantId.');

        // store FB_CONFIG then init firebase
        FB_CONFIG = fb;
        await initFirebaseAndExpose(FB_CONFIG, TENANT_ID);

        // apply settings and wire
        await applySettingsFromTenant();
        autoRedirect().catch(()=>{});
        getNumberBtn.addEventListener('click', e=>{ e.preventDefault(); getQueueNumber(); });

        // periodic refresh of settings in case server updates (3s)
        setInterval(applySettingsFromTenant, 3000);

      }catch(e){ console.error('init failed', e); showError(e && e.message ? e.message : 'Initialization failed'); }
    })();

  </script>
