<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Queue Joy — Digital Queue System</title>
  <meta name="description" content="Join the queue instantly. No app needed. Real-time digital queueing."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--theme:#8b5cf6;--theme2:#7c3aed;--bg:#f8f7ff;--surface:#fff;--text:#111827;--text-muted:#6b7280;--border:#e5e7eb;--green:#10b981;--red:#ef4444;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.03);--shadow-lg:0 12px 40px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05);--ease:cubic-bezier(.16,1,.3,1)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}

    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes successPop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
    @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideDown{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(100%)}}

    .fade-up{animation:fadeUp .5s var(--ease) both}
    .fade-up-1{animation-delay:50ms}
    .fade-up-2{animation-delay:120ms}
    .fade-up-3{animation-delay:200ms}
    .fade-up-4{animation-delay:300ms}

    .skeleton{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:800px 100%;animation:shimmer 1.2s infinite linear;border-radius:8px}

    /* Layout */
    .wrap{width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}

    /* Header */
    .header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
    .header-logo{width:44px;height:44px;border-radius:12px;object-fit:contain;flex-shrink:0;background:#f3f4f6}
    .header-logo-fallback{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--theme),var(--theme2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;flex-shrink:0}
    .header-info{flex:1;min-width:0}
    .header-small{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase}
    .header-title{font-size:16px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Hero Card */
    .hero{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;text-align:center;padding:32px 24px 28px}
    .hero-logo-wrap{width:88px;height:88px;margin:0 auto 16px;border-radius:50%;overflow:hidden;background:#f9fafb;border:3px solid #f3f4f6;display:flex;align-items:center;justify-content:center}
    .hero-logo{width:100%;height:100%;object-fit:contain}
    .hero-logo-fallback{font-size:36px;font-weight:800;color:var(--theme)}
    .hero-heading{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px;color:var(--text)}
    .hero-desc{font-size:14px;color:var(--text-muted);line-height:1.5;margin-bottom:24px}

    /* CTA */
    .cta-btn{width:100%;padding:16px 24px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:700;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:all .2s var(--ease);display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,var(--theme),var(--theme2));box-shadow:0 6px 20px color-mix(in srgb,var(--theme) 35%,transparent)}
    .cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px color-mix(in srgb,var(--theme) 45%,transparent)}
    .cta-btn:active{transform:scale(.97)}
    .cta-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .cta-btn .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    .cta-btn .icon{font-size:18px}

    /* Status badge */
    .status-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-muted);padding:4px 0}
    .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .status-dot.live{background:var(--green);box-shadow:0 0 6px rgba(16,185,129,.4)}
    .status-dot.loading{background:#f59e0b;animation:pulse 1.2s infinite}
    .status-dot.offline{background:var(--red)}

    /* Success overlay */
    .success-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
    .success-card{background:var(--surface);border-radius:20px;padding:36px 28px;text-align:center;max-width:360px;width:100%;animation:successPop .4s var(--ease) both;box-shadow:var(--shadow-lg)}
    .success-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green),#14b8a6);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
    .success-num{font-size:32px;font-weight:800;color:var(--theme);margin:8px 0 4px}
    .success-sub{font-size:14px;color:var(--text-muted)}

    /* Ad card */
    .ad-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .ad-label{padding:8px 16px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
    .ad-media{width:100%;max-height:200px;object-fit:cover;display:block}
    .ad-media-video{width:100%;max-height:200px;object-fit:cover;display:block}
    .ad-text{padding:10px 16px;font-size:13px;color:var(--text-muted);line-height:1.4}
    .ad-empty{padding:28px 16px;text-align:center;color:#d1d5db;font-size:13px}
    .ad-link{text-decoration:none;color:inherit;display:block}

    /* Toast */
    .toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none}
    .toast{pointer-events:auto;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;animation:slideUp .3s var(--ease) both;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
    .toast.success{background:var(--green)}
    .toast.error{background:var(--red)}
    .toast.info{background:#3b82f6}
    .toast-exit{animation:slideDown .2s ease-in both}

    /* Footer */
    .footer{text-align:center;padding:12px 0 24px;font-size:11px;color:#d1d5db}
    .footer a{color:var(--theme);text-decoration:none;font-weight:600}

    /* Skeleton states */
    .skel-header{height:68px;border-radius:var(--radius)}
    .skel-hero{height:300px;border-radius:var(--radius)}
    .skel-ad{height:100px;border-radius:var(--radius)}

    @media(max-width:480px){.wrap{padding:12px}}
  </style>
</head>
<body>

<div class="wrap" id="app">
  <!-- Skeleton loading state -->
  <div id="skel" class="fade-up">
    <div class="skeleton skel-header" style="margin-bottom:14px"></div>
    <div class="skeleton skel-hero" style="margin-bottom:14px"></div>
    <div class="skeleton skel-ad"></div>
  </div>

  <!-- Real content (hidden until loaded) -->
  <div id="content" style="display:none">
    <!-- Header -->
    <div class="header fade-up fade-up-1" id="headerCard">
      <div id="headerLogoWrap"></div>
      <div class="header-info">
        <div class="header-small" id="smallTopText">Queue Joy</div>
        <div class="header-title" id="headerTitle">Loading...</div>
      </div>
    </div>

    <!-- Status -->
    <div class="status-line fade-up fade-up-2" id="statusLine">
      <span class="status-dot loading"></span>
      <span id="statusText">Syncing...</span>
    </div>

    <!-- Hero -->
    <div class="hero fade-up fade-up-2" id="heroCard">
      <div class="hero-logo-wrap" id="centerLogoWrap">
        <span class="hero-logo-fallback" id="centerLogoFallback">🎫</span>
      </div>
      <div class="hero-heading" id="mainHeading">Get your queue number</div>
      <div class="hero-desc" id="introText">Real-time queueing system. Mobile-friendly. No app needed.</div>
      <button class="cta-btn" id="ctaBtn" disabled>
        <span class="icon">🎫</span>
        <span id="ctaBtnText">Loading...</span>
      </button>
    </div>

    <!-- Ad -->
    <div class="ad-card fade-up fade-up-3" id="adCard" style="display:none">
      <div class="ad-label">Advertisement</div>
      <div id="adContent"></div>
      <div class="ad-text" id="adText" style="display:none"></div>
    </div>

    <!-- Footer -->
    <div class="footer fade-up fade-up-4">Powered by <a href="https://helloqueuejoy.netlify.app" target="_blank" rel="noopener">Queue Joy</a></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Success overlay (hidden) -->
<div id="successOverlay" style="display:none"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import{getDatabase,ref,onValue,get,set,push,runTransaction}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js';

const FIREBASE_CONFIG={
  apiKey:"AIzaSyDiRGvkQbnLlpnJT3fEEQrY1A3nwLVIFY0",
  authDomain:"queue-joy-aa21b.firebaseapp.com",
  databaseURL:"https://queue-joy-aa21b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"queue-joy-aa21b",
  storageBucket:"queue-joy-aa21b.appspot.com",
  messagingSenderId:"950240394209",
  appId:"1:950240394209:web:78d4f2471d2d89ac91f0a0"
};

// ===== Helpers =====
const $=id=>document.getElementById(id);
let toastTimer=0;
function showToast(msg,type='info',ms=3500){
  const c=$('toastContainer'),t=document.createElement('div');
  t.className='toast '+type;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.classList.add('toast-exit');setTimeout(()=>t.remove(),200)},ms);
}

function isSafeUrl(url){
  if(!url||typeof url!=='string')return false;
  const u=url.trim().toLowerCase();
  if(u.startsWith('javascript:')||u.startsWith('data:')||u.startsWith('vbscript:'))return false;
  return u.startsWith('http://')||u.startsWith('https://')||u.startsWith('/');
}

function isActive(c){
  if(!c||typeof c!=='object')return false;
  const a=c.active;
  if(a===undefined||a===null)return true; // missing = active
  if(typeof a==='boolean')return a;
  if(typeof a==='number')return a!==0;
  const s=String(a).toLowerCase().trim();
  return s==='true'||s==='yes'||s==='1';
}

function resolveField(cfg,...keys){
  for(const k of keys){
    const parts=k.split('.');
    let v=cfg;
    for(const p of parts){if(!v||typeof v!=='object')break;v=v[p]}
    if(v!==undefined&&v!==null&&v!=='')return v;
  }
  return null;
}

function renderMedia(src,container,type='image'){
  if(!src){container.innerHTML='';return}
  const isVideo=type==='video'||(typeof src==='string'&&(src.startsWith('data:video')||/\.(mp4|webm|ogg|mov)/i.test(src)));
  if(isVideo){
    const v=document.createElement('video');
    v.src=src;v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;v.className='ad-media-video';
    v.loading='lazy';container.innerHTML='';container.appendChild(v);
  } else {
    const img=document.createElement('img');
    img.src=src;img.className='ad-media';img.loading='lazy';img.alt='Advertisement';
    img.onerror=()=>{img.style.display='none'};
    container.innerHTML='';container.appendChild(img);
  }
}

// ===== Init =====
const app=initializeApp(FIREBASE_CONFIG);
const db=getDatabase(app);

// Resolve tenant
const params=new URLSearchParams(window.location.search);
let slug=params.get('slug')||params.get('tenant')||params.get('tenantSlug')||'';
if(!slug){
  const path=window.location.pathname.replace(/^\/+|\/+$/g,'').split('/');
  slug=path.find(p=>p&&!p.includes('.html')&&!p.includes('.'))||'';
}

if(!slug){
  $('skel').style.display='none';
  $('content').style.display='flex';
  $('content').style.flexDirection='column';
  $('content').style.gap='14px';
  $('mainHeading').textContent='Missing Tenant';
  $('introText').textContent='Please access this page with a valid slug: ?slug=your-slug';
  $('ctaBtn').style.display='none';
  throw new Error('No slug');
}

window.__TENANT_SLUG=slug;

// Tenant resolution
let tenantId=slug;
try{
  const res=await fetch(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(slug)}`);
  if(res.ok){const j=await res.json();tenantId=j.tenantId||j.tenant||slug}
}catch{
  try{
    const snap=await get(ref(db,`slugs/${slug}`));
    if(snap.exists()){const v=snap.val();tenantId=typeof v==='string'?v:(v?.tenantId||slug)}
  }catch{}
}

window.__TENANT_ID=tenantId;
const tRef=p=>ref(db,`tenants/${tenantId}/${p}`);

// ===== State =====
let config={};
let counters={};
let countersLoaded=false;
let isJoining=false;
let connected=false;

// ===== Connection Monitor =====
onValue(ref(db,'.info/connected'),snap=>{
  connected=snap.val()===true;
  updateStatus();
});

function updateStatus(){
  const dot=$('statusLine')?.querySelector('.status-dot');
  const txt=$('statusText');
  if(!dot||!txt)return;
  if(!countersLoaded){
    dot.className='status-dot loading';txt.textContent='Syncing counters...';
  }else if(connected){
    dot.className='status-dot live';txt.textContent='Live';
  }else{
    dot.className='status-dot offline';txt.textContent='Offline — reconnecting...';
  }
}

// ===== Apply Config =====
function applyConfig(cfg){
  config=cfg;
  const themeColor=resolveField(cfg,'theme.color','themeColor')||'#8b5cf6';
  document.documentElement.style.setProperty('--theme',themeColor);
  // Derive darker shade
  document.documentElement.style.setProperty('--theme2',themeColor);

  // Title
  const name=resolveField(cfg,'displayName','name','siteTitle')||slug;
  $('headerTitle').textContent=name;
  document.title=name+' — Queue';

  // Small top text
  const small=resolveField(cfg,'smallTextOnTop','smallTopText')||'Queue Joy';
  $('smallTopText').textContent=small;

  // Top logo
  const topLogo=resolveField(cfg,'logoUrl','logo','theme.logo','branding.logo');
  const wrap=$('headerLogoWrap');
  if(topLogo){
    wrap.innerHTML=`<img class="header-logo" src="${topLogo}" alt="Logo" onerror="this.parentElement.innerHTML='<div class=header-logo-fallback>'+('${name}'[0]||'Q')+'</div>'">`;
  }else{
    wrap.innerHTML=`<div class="header-logo-fallback">${(name[0]||'Q').toUpperCase()}</div>`;
  }

  // Center logo
  const cLogo=resolveField(cfg,'centerLogoUrl','centerLogo','logo','logoUrl');
  const cWrap=$('centerLogoWrap');
  if(cLogo){
    cWrap.innerHTML=`<img class="hero-logo" src="${cLogo}" alt="Logo" onerror="this.parentElement.innerHTML='<span class=hero-logo-fallback>🎫</span>'">`;
  }

  // Heading
  const heading=resolveField(cfg,'titleinmiddle','ctaTitle','mainHeading')||'Get your queue number';
  $('mainHeading').textContent=heading;

  // Description
  const desc=resolveField(cfg,'introText','description')||'Real-time queueing system. Mobile-friendly. No app needed.';
  $('introText').textContent=desc;

  // Button text
  const btnText=resolveField(cfg,'ctaText','buttonText')||'Get your queue number';
  if(!isJoining)$('ctaBtnText').textContent=btnText;

  // Ad
  const adVideo=resolveField(cfg,'ad.video','adVideoUrl','adVideo');
  const adImage=resolveField(cfg,'ad.image','adImageUrl','adImage');
  const adLink=resolveField(cfg,'ad.link','adUrl','adHref');
  const adTxt=resolveField(cfg,'adText');

  if(adVideo||adImage){
    $('adCard').style.display='';
    const ac=$('adContent');
    if(adLink&&isSafeUrl(adLink)){
      const a=document.createElement('a');
      a.href=adLink;a.target='_blank';a.rel='noopener noreferrer';a.className='ad-link';
      const inner=document.createElement('div');
      renderMedia(adVideo||adImage,inner,adVideo?'video':'image');
      a.appendChild(inner);ac.innerHTML='';ac.appendChild(a);
    }else{
      renderMedia(adVideo||adImage,ac,adVideo?'video':'image');
    }
    if(adTxt){$('adText').textContent=adTxt;$('adText').style.display=''}
    else{$('adText').style.display='none'}
  }else{
    $('adCard').style.display='none';
  }
}

// ===== Load Config (one-time seed + live listener) =====
// Seed via get-tenant (already done above for tenantId)
// Live listener = canonical source
onValue(tRef('public/config'),snap=>{
  if(snap.exists())applyConfig(snap.val()||{});
  // Show content once config is loaded
  $('skel').style.display='none';
  $('content').style.display='flex';
  $('content').style.flexDirection='column';
  $('content').style.gap='14px';
},{onlyOnce:false});

// ===== Counters Listener =====
onValue(tRef('counters'),snap=>{
  counters=snap.exists()?(snap.val()||{}):{};
  countersLoaded=true;
  updateStatus();
  updateCtaState();
});

function getActiveCounters(){
  return Object.entries(counters)
    .filter(([,c])=>isActive(c))
    .sort((a,b)=>(a[1].order||0)-(b[1].order||0))
    .map(([id,c])=>({id,...c}));
}

function updateCtaState(){
  const btn=$('ctaBtn');
  if(!countersLoaded){btn.disabled=true;$('ctaBtnText').textContent='Loading...';return}
  const active=getActiveCounters();
  if(active.length===0){
    btn.disabled=true;
    $('ctaBtnText').textContent='No active counters right now';
  }else{
    btn.disabled=isJoining;
    if(!isJoining){
      const btnText=resolveField(config,'ctaText','buttonText')||'Get your queue number';
      $('ctaBtnText').textContent=btnText;
    }
  }
}

// ===== Queue Join (Round Robin) =====
$('ctaBtn').addEventListener('click',async e=>{
  e.preventDefault();
  if(isJoining)return;

  const active=getActiveCounters();
  if(active.length===0){showToast('No active counters available.','error');return}

  isJoining=true;
  const btn=$('ctaBtn');
  btn.disabled=true;
  $('ctaBtnText').textContent='Getting your number...';
  // Show spinner
  const iconEl=btn.querySelector('.icon');
  if(iconEl)iconEl.innerHTML='<span class="spinner"></span>';

  try{
    // 1. Atomic round-robin index
    const rrRef=tRef('queueState/lastCounterIndex');
    let globalCounter=0;
    await runTransaction(rrRef,cur=>(Number(cur)||0)+1);
    const rrSnap=await get(rrRef);
    globalCounter=Number(rrSnap.val())||1;

    const n=active.length;
    const index=((globalCounter-1)%n+n)%n;
    let chosen=active[index]||active[0];

    // 2. Atomic increment lastIssued
    const liRef=tRef(`counters/${chosen.id}/lastIssued`);
    await runTransaction(liRef,cur=>(Number(cur)||0)+1);
    const liSnap=await get(liRef);
    const nextNumber=Number(liSnap.val())||1;

    const prefix=(chosen.prefix&&String(chosen.prefix))||'Q';
    const queueId=`${prefix}${String(nextNumber).padStart(3,'0')}`;

    // 3. Push queue entry
    const newNode=push(tRef('queue'));
    const now=Date.now();
    await set(newNode,{
      counterId:chosen.id,
      queueId,
      number:queueId,
      prefix,
      numberVal:nextNumber,
      timestamp:now,
      createdAt:now,
      updatedAt:now,
      status:'waiting',
      slug,
      tenantId
    });

    // Save to session
    try{sessionStorage.setItem('lastQueueId',newNode.key);sessionStorage.setItem('lastQueueNumber',queueId)}catch{}

    // Show success
    showSuccess(queueId,newNode.key);

  }catch(err){
    console.error('getQueueNumber error',err);
    showToast(err?.message||'Failed to get queue number. Try again.','error');
    isJoining=false;
    if(iconEl)iconEl.innerHTML='🎫';
    updateCtaState();
  }
});

function showSuccess(queueId,nodeKey){
  const ov=$('successOverlay');
  ov.style.display='';
  ov.innerHTML=`
    <div class="success-overlay">
      <div class="success-card">
        <div class="success-icon">✓</div>
        <div style="font-size:14px;color:var(--text-muted);margin-bottom:4px">Your queue number</div>
        <div class="success-num">${queueId}</div>
        <div class="success-sub">Redirecting to status page...</div>
      </div>
    </div>`;

  setTimeout(()=>{
    const base=window.location.origin;
    const statusUrl=`${base}/status.html?queueId=${encodeURIComponent(nodeKey)}&slug=${encodeURIComponent(slug)}&tenantId=${encodeURIComponent(tenantId)}`;
    window.location.href=statusUrl;
  },1200);
}

</script>
</body>
</html>
