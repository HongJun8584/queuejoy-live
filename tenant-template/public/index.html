<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Queue Joy - Digital Queue System</title>

  <!-- Tailwind (dev) + font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --card-radius: 1rem; --theme-color: #8b5cf6; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .fade-in { animation: fadeIn 0.45s cubic-bezier(.2,.9,.2,1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    .db-image { max-height: 180px; object-fit: cover; }
    .media-cover { width:100%; height:180px; object-fit:cover; display:block }
    .logo-small { width:48px; height:48px; object-fit:cover; border-radius:9999px }
    .logo-center { width:80px; height:80px; object-fit:cover; border-radius:9999px }
  </style>

  <!-- Firebase v10 (module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      get,
      child,
      push,
      onValue,
      runTransaction,
      off
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // --- Site-wide Firebase client config (shared project)
    const siteFirebaseConfig = {
      apiKey: "AIzaSyDiRGvkQbnLlpnJT3fEEQrY1A3nwLVIFY0",
      authDomain: "queue-joy-aa21b.firebaseapp.com",
      databaseURL: "https://queue-joy-aa21b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "queue-joy-aa21b",
      storageBucket: "queue-joy-aa21b.appspot.com",
      messagingSenderId: "950240394209",
      appId: "1:950240394209:web:78d4f2471d2d89ac91f0a0"
    };

    // ---------- Utility helpers ----------
    function showFatal(msg) {
      console.error(msg);
      const el = document.createElement('div');
      el.style = 'background:#fee;padding:12px;color:#900;font-weight:700;position:fixed;left:8px;right:8px;top:8px;z-index:9999';
      el.innerText = 'ERROR: ' + msg;
      document.body ? document.body.prepend(el) : document.documentElement.appendChild(el);
    }

    function getSlugFromQuery() {
      try {
        const qp = new URLSearchParams(window.location.search);
        const s = qp.get('slug');
        return s ? String(s).trim() : null;
      } catch (e) { return null; }
    }

    // tenantRef factory
    function tenantRefFactory(dbInstance) {
      return function tenantRef(relPath = '') {
        relPath = String(relPath || '').replace(/^\/+/, '');
        const tenantId = window.__TENANT_ID || null;
        const slug = window.__TENANT_SLUG || null;
        if (!tenantId && !slug) {
          throw new Error('tenantRef requires TENANT_ID or TENANT_SLUG to be set');
        }
        const base = tenantId ? `tenants/${tenantId}` : `tenants/${slug}`;
        if (!relPath) return ref(dbInstance, base);
        return ref(dbInstance, `${base}/${relPath}`);
      };
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function runTxWithRetries(pathRef, updater, maxRetries = 6) {
      let lastErr = null;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          const result = await runTransaction(pathRef, updater, { applyLocally: false });
          if (result && result.committed) return result;
          lastErr = new Error(`Transaction not committed (attempt ${attempt})`);
        } catch (err) {
          lastErr = err;
          console.warn(`[tx] attempt ${attempt} failed`, err);
        }
        const backoff = 100 * Math.pow(2, attempt - 1) + Math.floor(Math.random() * 120);
        await sleep(backoff);
      }
      throw lastErr || new Error('Transaction failed after retries');
    }

    // ---------- Media helpers ----------
    function isVideoUrl(url) {
      return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url) || url.startsWith('data:video/');
    }
    function isImageUrl(url) {
      return /\.(png|jpe?g|gif|svg|webp)(\?.*)?$/i.test(url) || url.startsWith('data:image/');
    }

    function createMediaElement(url, { classes = '', autoplay = false, muted = true, loop = true, playsinline = true } = {}) {
      if (!url) return null;
      if (isVideoUrl(url)) {
        const v = document.createElement('video');
        if (playsinline) v.setAttribute('playsinline','');
        if (autoplay) v.setAttribute('autoplay','');
        if (loop) v.setAttribute('loop','');
        if (muted) v.muted = true;
        v.preload = 'metadata';
        v.src = url;
        v.className = classes || '';
        v.playsInline = !!playsinline;
        v.setAttribute('draggable','false');
        return v;
      }
      if (isImageUrl(url)) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'media';
        img.className = classes || '';
        img.setAttribute('draggable','false');
        return img;
      }
      // fallback to text
      const span = document.createElement('span');
      span.textContent = url;
      return span;
    }

    // Small utility to safely pick first non-null config value from multiple keys (supports nested via dot)
    function pickCfg(cfg, ...keys) {
      const pick = v => (typeof v === 'string' && v.trim()) ? v.trim() : (typeof v === 'number' || typeof v === 'boolean') ? v : null;
      for (const k of keys) {
        if (!k) continue;
        const parts = k.split('.');
        let cur = cfg;
        for (const p of parts) { if (!cur) break; cur = cur[p]; }
        const val = pick(cur);
        if (val !== null) return val;
      }
      return null;
    }

    // ---------- Startup ----------
    document.addEventListener('DOMContentLoaded', async () => {
      // DOM refs
      const siteTitleEl = document.getElementById('siteTitle');
      const siteLogoEl = document.getElementById('siteLogo');
      const centerLogoEl = document.getElementById('centerLogo');
      const centerIcon = document.getElementById('centerIcon');
      const mainHeading = document.getElementById('mainHeading');
      const introText = document.getElementById('introText');
      const getNumberBtn = document.getElementById('getNumberBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const adLinkEl = document.getElementById('adLink');
      const adTextEl = document.getElementById('adText');
      const noAd = document.getElementById('noAd');
      const smallTopTextEl = document.getElementById('smallTopText');
      const adContainer = document.getElementById('adContainer');

      // allow user to click anytime (user requested: don't disable button by default)
      getNumberBtn.disabled = false;

      // extract slug
      const slug = getSlugFromQuery();
      if (!slug) {
        showFatal('Missing slug — open as ?slug=your-tenant-slug');
        return;
      }
      window.__TENANT_SLUG = slug;

      // Resolve tenant via Netlify function
      let tenantId = null;
      try {
        const res = await fetch(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(slug)}`, { cache: 'no-store' });
        if (!res.ok) {
          const txt = await res.text().catch(()=>null);
          showFatal(`Tenant lookup failed (${res.status}): ${txt || res.statusText}`);
          return;
        }
        const j = await res.json();
        tenantId = j.tenantId || null;
        const tenantPublicConfig = j.config || j.public || {};
        if (!tenantId && tenantPublicConfig && tenantPublicConfig.tenantId) tenantId = tenantPublicConfig.tenantId;
        if (!tenantId) tenantId = slug;
        window.__TENANT_ID = tenantId;
        // seed config from server response (so UI can show something quickly)
        window.__TENANT_PUBLIC_CONFIG = Object.assign({}, tenantPublicConfig || {});
      } catch (e) {
        showFatal('Failed to resolve tenant: ' + String(e && e.message ? e.message : e));
        return;
      }

      // Initialize Firebase
      let app, db;
      try {
        app = initializeApp(siteFirebaseConfig);
        db = getDatabase(app);
        window._db = db;
      } catch (e) {
        showFatal('Failed to init Firebase: ' + String(e && e.message ? e.message : e));
        return;
      }

      const tenantRef = tenantRefFactory(db);

      // caches
      let countersCache = {};
      let countersLoaded = false;
      let settingsCache = {};

      // counters listener
      try {
        const countersRef = tenantRef('counters');
        onValue(countersRef, snap => {
          countersCache = {};
          if (snap && typeof snap.forEach === 'function') snap.forEach(ch => countersCache[ch.key] = ch.val());
          else if (snap && typeof snap.val === 'function' && snap.exists && snap.exists()) Object.assign(countersCache, snap.val() || {});
          countersLoaded = true;
          // do not disable button here (user asked), but we keep internal flag
          console.debug('counters loaded', Object.keys(countersCache).length);
        }, err => console.warn('counters listener failed', err));
      } catch (e) { console.warn('counters listener setup failed', e); }

      // Helper: render logo/media into container — supports image/gif/video
      function renderLogo(container, url, classes) {
        container.innerHTML = '';
        if (!url) return container.classList.add('hidden');
        const el = createMediaElement(url, { classes });
        if (!el) return container.classList.add('hidden');
        // For videos, we lazy-play only when visible
        if (el.tagName === 'VIDEO') {
          el.muted = true; el.loop = true; el.playsInline = true; el.preload = 'metadata';
          el.setAttribute('aria-hidden','true');
          // attempt to play but ignore errors
          el.play().catch(()=>{});
        }
        container.appendChild(el);
        container.classList.remove('hidden');
      }

      // settings listener — tenant-scoped /public/config
      try {
        const settingsRef = tenantRef('public/config');
        onValue(settingsRef, snap => {
          try {
            settingsCache = (snap && typeof snap.val === 'function' && snap.exists && snap.exists()) ? snap.val() : {};
            // merge into global config (server seed + realtime updates)
            window.__TENANT_PUBLIC_CONFIG = Object.assign({}, window.__TENANT_PUBLIC_CONFIG || {}, settingsCache || {});

            const cfg = window.__TENANT_PUBLIC_CONFIG || {};

            // theme color
            const themeColor = pickCfg(cfg, 'theme.color', 'themeColor', 'themeColorHex');
            if (themeColor) document.documentElement.style.setProperty('--theme-color', themeColor);

            // title
            const siteTitle = pickCfg(cfg, 'displayName', 'name', 'siteTitle', 'title', 'mainTitle');
            if (siteTitle) { siteTitleEl.textContent = siteTitle; document.title = `${siteTitle} - Digital Queue System`; }
            else { siteTitleEl.textContent = 'Queue Joy'; document.title = 'Queue Joy - Digital Queue System'; }

            // small top text
            const smallTop = pickCfg(cfg, 'smallTextOnTop', 'smallTopText', 'smallTop');
            if (smallTop && smallTopTextEl) smallTopTextEl.textContent = smallTop;

            // logos (support image/gif/video) — prefer explicit keys
            const topLogo = pickCfg(cfg, 'logoUrl', 'logo', 'theme.logo', 'branding.logo');
            const centerLogo = pickCfg(cfg, 'centerLogoUrl', 'centerLogo', 'logo', 'theme.logo');
            renderLogo(siteLogoEl, topLogo, 'logo-small');
            renderLogo(centerLogoEl, centerLogo, 'logo-center');
            if (!centerLogo) centerIcon.classList.remove('hidden'); else centerIcon.classList.add('hidden');

            // heading, intro, button text
            const heading = pickCfg(cfg, 'titleinmiddle', 'titleInMiddle', 'ctaTitle', 'heading', 'mainHeading');
            mainHeading.textContent = heading || 'Get your queue number';
            const intro = pickCfg(cfg, 'introText', 'description', 'smallTextOnTop', 'subtitle');
            introText.textContent = intro || 'Real-time queueing system. Mobile-friendly. No app needed.';
            const cta = pickCfg(cfg, 'ctaText', 'cta', 'buttonText', 'getNumberText');
            btnText.textContent = '🎫 ' + (cta || 'Get your queue number');

            // Advertisement handling — single source only (ad.video or ad.image or adImage)
            adContainer.innerHTML = '';
            const adVideo = pickCfg(cfg, 'ad.video', 'adVideo', 'adVideoUrl');
            const adImage = pickCfg(cfg, 'ad.image', 'adImage', 'adImageUrl', 'adImageUrl');
            const adLink = pickCfg(cfg, 'ad.link', 'adUrl', 'adHref', 'adLink');
            window.__TENANT_PUBLIC_CONFIG._ad = { adVideo, adImage, adLink };

            // create placeholder element — we will lazy load actual media when visible
            if (adVideo || adImage) {
              const placeholder = document.createElement('div');
              placeholder.className = 'w-full';
              placeholder.style.minHeight = '180px';
              adContainer.appendChild(placeholder);
              adContainer.classList.remove('hidden');
              noAd.classList.add('hidden');

              // set link target
              if (adLink) adLinkEl.href = adLink; else adLinkEl.href = '#';

              // lazy load when in viewport
              const io = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                  if (!entry.isIntersecting) return;
                  // load media
                  if (adVideo) {
                    const v = createMediaElement(adVideo, { classes: 'media-cover', autoplay: true, muted: true, loop: true });
                    if (v) {
                      v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
                      v.setAttribute('controls', ''); // show controls as fallback when autoplay blocked
                      v.addEventListener('ended', () => { try { v.currentTime = 0; v.play().catch(()=>{}); } catch(e){} });
                      // ensure autoplay muted
                      v.autoplay = true;
                      entry.target.innerHTML = '';
                      entry.target.appendChild(v);
                      v.play().catch(()=>{});
                    }
                  } else if (adImage) {
                    const img = createMediaElement(adImage, { classes: 'media-cover' });
                    if (img) { entry.target.innerHTML = ''; entry.target.appendChild(img); }
                  }
                  obs.disconnect();
                });
              }, { rootMargin: '200px' });
              io.observe(placeholder);

              // clicking ad container should navigate to adLink (external allowed)
              adLinkEl.addEventListener('click', (ev) => {
                const href = adLinkEl.getAttribute('href') || '';
                if (!href || href === '#') { ev.preventDefault(); return; }
                // allow navigation
              });
            } else {
              adContainer.classList.add('hidden');
              noAd.classList.remove('hidden');
              adLinkEl.href = '#';
            }

            const adText = pickCfg(cfg, 'adText', 'ad.text');
            adTextEl.textContent = adText || '';
            adTextEl.classList.toggle('hidden', !adTextEl.textContent);

          } catch (e) {
            console.warn('apply settings to UI failed', e);
          }
        }, err => console.warn('settings read failed', err));
      } catch (e) { console.warn('settings listener setup failed', e); }

      // UI helpers
      function showError(msg) {
        console.warn(msg);
        try { errorMessage.querySelector('p').textContent = msg; errorMessage.classList.remove('hidden'); successMessage.classList.add('hidden'); setTimeout(()=>errorMessage.classList.add('hidden'),6000); } catch(e){}
      }
      function showSuccess(msg) {
        try { successMessage.querySelector('p').textContent = msg; successMessage.classList.remove('hidden'); errorMessage.classList.add('hidden'); setTimeout(()=>successMessage.classList.add('hidden'),6000); } catch(e){}
      }
      function setLoading(flag) {
        // during loading disable to prevent double submits; but don't permanently disable based on counters
        getNumberBtn.disabled = !!flag;
        btnText.classList.toggle('hidden', flag);
        btnSpinner.classList.toggle('hidden', !flag);
        getNumberBtn.setAttribute('aria-busy', String(flag));
      }

      // Auto-redirect if lastQueueId still waiting — preserve slug
      (async function autoRedirect() {
        try {
          const lastQueueId = sessionStorage.getItem('lastQueueId');
          if (!lastQueueId) return;
          const snap = await get(child(tenantRef('queue'), lastQueueId));
          if (snap && snap.exists && snap.val && snap.val().status === 'waiting') {
            const target = `status.html?queueId=${encodeURIComponent(lastQueueId)}&slug=${encodeURIComponent(slug)}&tenantId=${encodeURIComponent(tenantId)}`;
            console.info('Auto-redirecting to local status page ->', target);
            window.location.href = target;
          }
        } catch (e) { console.warn('autoRedirect check failed', e); }
      })();

      // getQueueNumber core
      async function getQueueNumber() {
        setLoading(true);
        try {
          // refresh counters if not loaded (one-off)
          if (!countersLoaded) {
            const snap = await get(tenantRef('counters'));
            if (snap && snap.exists && typeof snap.forEach === 'function') { countersCache = {}; snap.forEach(ch => countersCache[ch.key] = ch.val()); }
            else if (snap && snap.exists && typeof snap.val === 'function') countersCache = snap.val() || {};
            countersLoaded = true;
          }

          const activeCounters = Object.keys(countersCache).filter(k => {
            const v = countersCache[k];
            if (!v) return false;
            const activeRaw = v.active;
            if (activeRaw === undefined || activeRaw === null) return true; // default active
            const s = String(activeRaw).toLowerCase();
            return activeRaw === true || s === 'true' || s === '1' || s === 'yes' || s === 'y' || activeRaw === 1;
          }).map(id => ({ id, ...(countersCache[id]||{}) }));

          if (!activeCounters || activeCounters.length === 0) {
            // per your requirement: do not disable button — but show a helpful error
            showError('No active counters right now. Please ask staff to open a counter.');
            return;
          }

          // round-robin index (atomic)
          const rrRef = tenantRef('settings/lastCounterIndex');
          const rrResult = await runTxWithRetries(rrRef, cur => (Number(cur)||0) + 1, 8);
          if (!rrResult || rrResult.committed !== true) throw new Error('Round-robin tx failed');
          const globalCounter = Number(rrResult.snapshot && rrResult.snapshot.val());
          if (!Number.isFinite(globalCounter)) throw new Error('Invalid round-robin value');

          const n = activeCounters.length;
          const index = ((globalCounter - 1) % n + n) % n;
          let chosen = activeCounters[index] || activeCounters[0];

          // increment per-counter lastIssued
          const lastIssuedRef = tenantRef(`counters/${chosen.id}/lastIssued`);
          const lastIssuedTx = await runTxWithRetries(lastIssuedRef, cur => (Number(cur)||0) + 1, 8);
          if (!lastIssuedTx || lastIssuedTx.committed !== true) throw new Error('Failed to increment lastIssued');

          const nextNumber = Number(lastIssuedTx.snapshot && lastIssuedTx.snapshot.val());
          if (!Number.isFinite(nextNumber)) throw new Error('Invalid nextNumber');

          const prefix = (chosen.prefix && String(chosen.prefix)) || 'Q';
          const queueId = `${prefix}${String(nextNumber).padStart(3,'0')}`;

          // push queue entry
          const newNode = push(tenantRef('queue'));
          await set(newNode, { counterId: chosen.id, queueId, timestamp: Date.now(), status: 'waiting' });

          try { sessionStorage.setItem('lastQueueId', newNode.key); sessionStorage.setItem('lastTenantSlug', slug); } catch(e){}

          showSuccess(`You're number ${queueId}`);
          setTimeout(()=>{
            const target = `status.html?queueId=${encodeURIComponent(newNode.key)}&slug=${encodeURIComponent(slug)}&tenantId=${encodeURIComponent(tenantId)}`;
            window.location.href = target;
          }, 700);

        } catch (err) {
          console.error('getQueueNumber error', err);
          showError(err && err.message ? err.message : 'Failed to get queue number.');
        } finally { setLoading(false); }
      }

      // wire button
      getNumberBtn.addEventListener('click', e => { e.preventDefault(); getQueueNumber(); });

    }); // DOMContentLoaded end
  </script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 via-purple-50 to-rose-50 flex flex-col items-center p-6 pb-20">

  <!-- Header -->
  <header class="w-full max-w-3xl mb-6">
    <div class="bg-white rounded-2xl shadow-md p-4 flex items-center gap-4">
      <div id="siteLogo" class="hidden"></div>
      <div class="flex-1 text-left">
        <h1 id="siteTitle" class="text-lg font-bold text-gray-800">Queue Joy</h1>
        <p id="smallTopText" class="text-xs text-gray-500">Digital Queue System</p>
      </div>
      <div class="text-right text-xs text-gray-400">Powered by Queue Joy</div>
    </div>
  </header>

  <!-- Main -->
  <main class="w-full max-w-3xl flex flex-col items-center gap-8">
    <section class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6 text-center fade-in relative">
      <div class="mx-auto">
        <div id="centerLogo" class="hidden"></div>
        <div id="centerIcon" class="w-20 h-20 bg-gradient-to-r from-purple-600 to-indigo-500 rounded-full flex items-center justify-center mx-auto">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
          </svg>
        </div>
      </div>

      <div class="space-y-2">
        <h2 id="mainHeading" class="text-2xl font-bold text-gray-800">Get your queue number</h2>
        <p id="introText" class="text-gray-600">Real-time queueing system. Mobile-friendly. No app needed.</p>
      </div>

      <button id="getNumberBtn" class="w-full py-4 bg-gradient-to-r from-purple-600 to-purple-400 text-white font-semibold rounded-2xl shadow-lg hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
        <span id="btnText">🎫 Get your queue number</span>
        <span id="btnSpinner" class="hidden inline-flex items-center ml-2">
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          Getting your number...
        </span>
      </button>

      <div id="errorMessage" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg"><p class="text-red-600 text-sm"></p></div>
      <div id="successMessage" class="hidden p-3 bg-green-50 border border-green-200 rounded-lg"><p class="text-green-600 text-sm"></p></div>
    </section>

    <!-- Advertisement card -->
    <aside class="w-full max-w-md bg-white rounded-xl shadow-lg p-3">
      <p class="text-xs text-gray-500 text-center mb-2">Advertisement</p>
      <a id="adLink" href="#" class="block relative">
        <div id="adContainer" class="w-full rounded-lg shadow-md overflow-hidden"></div>
      </a>
      <div id="noAd" class="text-center text-gray-400 text-sm py-6">No advertisement available</div>
      <div id="adText" class="text-xs text-gray-600 text-center mt-2 hidden"></div>
    </aside>
  </main>
</body>
</html>
