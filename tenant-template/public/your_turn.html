<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Queue Joy — Your Turn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #tenant-badge { position: fixed; right: 12px; bottom: 12px; background: #111827; color:#fff; padding:8px 10px; border-radius:8px; font-size:12px; z-index:9999; display:none; }
    #tenant-badge small { opacity:0.9; font-weight:700; margin-right:6px; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-6">

  <div id="tenant-badge"><small>slug</small><span id="tenant-badge-slug"></span> · <small>id</small> <span id="tenant-badge-id"></span></div>

  <div class="w-full max-w-md bg-white rounded-xl shadow p-6 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-3">It’s Your Turn</h1>

    <div class="mb-6">
      <div class="text-sm text-gray-500">Your Queue Number</div>
      <div id="yourNumber" class="mt-2 text-6xl font-extrabold text-indigo-700">—</div>
      <div id="tgBadge" class="mt-2 text-xs text-green-600 hidden">Connected via Telegram</div>
    </div>

    <div>
      <div class="text-sm text-gray-500">Proceed To</div>
      <div id="counterName" class="mt-2 text-3xl font-bold text-purple-700">—</div>
    </div>

    <div class="mt-6 text-xs text-gray-400" id="fbStatus">Connecting to Firebase…</div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { getDatabase, ref, onValue, off, get } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js';

    // --- site Firebase config (same as your other pages) ---
    const siteFirebaseConfig = {
      apiKey: "AIzaSyDiRGvkQbnLlpnJT3fEEQrY1A3nwLVIFY0",
      authDomain: "queue-joy-aa21b.firebaseapp.com",
      databaseURL: "https://queue-joy-aa21b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "queue-joy-aa21b",
      storageBucket: "queue-joy-aa21b.firebasestorage.app",
      messagingSenderId: "950240394209",
      appId: "1:950240394209:web:78d4f2471d2d89ac91f0a0"
    };

    // DOM refs
    const yourNumberEl = document.getElementById('yourNumber');
    const counterNameEl = document.getElementById('counterName');
    const fbStatusEl = document.getElementById('fbStatus');
    const tgBadge = document.getElementById('tgBadge');

    // tenant QA badge
    const tenantBadge = document.getElementById('tenant-badge');
    const tenantBadgeSlug = document.getElementById('tenant-badge-slug');
    const tenantBadgeId = document.getElementById('tenant-badge-id');

    // state
    let app, db, queueRef, counterRef;
    let queueKey = null;
    let lastTicket = null;
    const alertedKeyPrefix = 'qj_alerted_';
    let tenantResolved = false;

    // -------------------------
    // Tenant helpers
    // -------------------------
    function getSlugFromQueryOrPath() {
      try {
        const qp = new URLSearchParams(window.location.search);
        const s = qp.get('slug') || qp.get('tenant') || qp.get('tenantSlug');
        if (s && String(s).trim()) return String(s).trim();
      } catch (e) {}
      // fallback: first path segment (if not a file)
      try {
        const p = window.location.pathname.replace(/^\/+|\/+$/g,'').split('/');
        if (p && p.length && p[0] && !p[0].includes('.') ) return p[0];
      } catch (e) {}
      return null;
    }

    async function resolveTenant(slug) {
      if (!slug) return null;
      try {
        const res = await fetch(`/.netlify/functions/get-tenant?slug=${encodeURIComponent(slug)}`, { cache: 'no-store' });
        if (!res.ok) {
          const txt = await res.text().catch(()=>null);
          throw new Error(`get-tenant failed (${res.status}) ${txt || ''}`);
        }
        const j = await res.json();
        // expected: { tenantId: '...', config: {...} }
        return j;
      } catch (e) {
        console.warn('Tenant resolve error', e);
        return null;
      }
    }

    // tenantRef factory: prefer tenants/{tenantId}/... else fallback to provided path
    function tenantRefFactory(dbInstance) {
      return function tenantRef(relPath = '') {
        relPath = String(relPath || '').replace(/^\/+/, '');
        const tenantId = window.__TENANT_ID || null;
        const slug = window.__TENANT_SLUG || null;
        if (!tenantId && !slug) {
          // no tenant info — caller will handle using plain ref if desired
          return ref(dbInstance, relPath || '/');
        }
        const base = tenantId ? `tenants/${tenantId}` : `tenants/${slug}`;
        if (!relPath) return ref(dbInstance, base);
        return ref(dbInstance, `${base}/${relPath}`);
      };
    }

    // safe read that tries tenant-scoped path first, then global legacy path
    async function getTenantFirst(dbInstance, tenantRefFn, relPath) {
      try {
        const snap = await get(tenantRefFn(relPath));
        if (snap && snap.exists && typeof snap.val === 'function') return snap.val();
      } catch (e) { /* ignore */ }
      try {
        const snap2 = await get(ref(dbInstance, relPath));
        if (snap2 && snap2.exists && typeof snap2.val === 'function') return snap2.val();
      } catch (e) { /* ignore */ }
      return null;
    }

    // -------------------------
    // Audio / alert helpers
    // -------------------------
    function playSoftChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        const o = ctx.createOscillator();
        const g = ctx.createGain();

        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.value = 0.0001;

        o.connect(g);
        g.connect(ctx.destination);

        const now = ctx.currentTime;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

        o.start(now);
        o.stop(now + 0.85);

        setTimeout(() => { try { ctx.close(); } catch (_) {} }, 1000);
      } catch (e) {
        console.warn('playSoftChime failed', e);
      }
    }

    function alertUser(ticket, counterName) {
      const alertedKey = alertedKeyPrefix + (queueKey || 'unknown');
      if (localStorage.getItem(alertedKey)) return;
      localStorage.setItem(alertedKey, 'true');

      if (ticket) yourNumberEl.textContent = ticket;
      if (counterName) counterNameEl.textContent = counterName;

      playSoftChime();
      try { if (navigator.vibrate) navigator.vibrate([180,80,180]); } catch(e) {}

      const originalTitle = document.title;
      document.title = `▶ Your Turn — ${ticket || ''}`;
      setTimeout(() => { document.title = originalTitle; }, 2500);
      try { window.focus(); } catch(_) {}
    }

    // parse numeric suffix of tickets (robust)
    function parseTicketNum(ticket) {
      if (!ticket) return NaN;
      const s = String(ticket);
      const letters = s.match(/^[A-Za-z]+/);
      const numPart = letters ? s.slice(letters[0].length) : s;
      return parseInt(numPart, 10) || NaN;
    }

    // -------------------------
    // Firebase listeners (tenant-aware)
    // -------------------------
    let attachedCounterId = null;

    function attachCounterListeners(dbInstance, tenantRefFn, counterId) {
      if (!counterId) return;
      if (attachedCounterId === counterId) return;
      attachedCounterId = counterId;

      // cleanup previous
      try { if (counterRef) { off(counterRef); counterRef = null; } } catch(_) {}

      // Primary: tenant-scoped counters/{counterId}
      const candidatePaths = [
        `counters/${counterId}`,
        `counters/${counterId}/nowServing`,
        // legacy fallback
        `counters/${counterId}`
      ];

      // Attach one listener that watches either object or nowServing node
      try {
        // try tenant-scoped object ref
        counterRef = tenantRefFn(`counters/${counterId}`);
        onValue(counterRef, (snap) => {
          if (!snap.exists()) return;
          const c = snap.val() || {};
          counterNameEl.textContent = c.name || `Counter ${counterId}`;

          // handle nowServing which might be a child or a value inside object
          if (c.nowServing !== undefined && c.nowServing !== null) {
            evaluateNowServing(c.nowServing, c.name);
          } else {
            // attach to nested nowServing if available
            try {
              const nestedRef = tenantRefFn(`counters/${counterId}/nowServing`);
              onValue(nestedRef, (nsSnap) => {
                if (!nsSnap.exists()) return;
                evaluateNowServing(nsSnap.val(), c.name);
              });
            } catch (e) { /* ignore */ }
          }
        });
      } catch (e) {
        // final fallback: global counters path
        try {
          counterRef = ref(dbInstance, `counters/${counterId}`);
          onValue(counterRef, (snap) => {
            if (!snap.exists()) return;
            const c = snap.val() || {};
            counterNameEl.textContent = c.name || `Counter ${counterId}`;
            if (c.nowServing !== undefined && c.nowServing !== null) evaluateNowServing(c.nowServing, c.name);
          });
        } catch (err) {
          console.warn('attachCounter fallback failed', err);
        }
      }
    }

    function evaluateNowServing(nowServingValue, counterName) {
      if (!lastTicket) return;
      const ticketNum = parseTicketNum(lastTicket);
      const currentNum = parseTicketNum(nowServingValue);
      if (isNaN(ticketNum) || isNaN(currentNum)) {
        if (String(nowServingValue) === String(lastTicket)) alertUser(lastTicket, counterName);
        return;
      }
      if (currentNum >= ticketNum) alertUser(lastTicket, counterName);
    }

    async function attachQueueListeners(dbInstance, tenantRefFn, qKey) {
      if (!qKey) return;
      // cleanup previous
      try { if (queueRef) { off(queueRef); queueRef = null; } } catch(_) {}

      // Try multiple candidate paths in priority:
      // 1) tenants/{tenantId}/queues/{qKey}
      // 2) tenants/{tenantId}/queue/{qKey}
      // 3) global /queues/{qKey}
      // 4) global /queue/{qKey}
      const candidates = [
        `queues/${qKey}`,
        `queue/${qKey}`,
        // legacy global
        `queues/${qKey}`,
        `queue/${qKey}`
      ];

      let attached = false;
      for (const p of candidates) {
        try {
          queueRef = tenantRefFn(p);
          onValue(queueRef, (snap) => {
            if (!snap.exists()) {
              // if listener attached for this path and nothing here, show not found (but keep trying other paths isn't possible once attached)
              yourNumberEl.textContent = '--';
              counterNameEl.textContent = '--';
              fbStatusEl.textContent = 'Queue not found';
              return;
            }
            const q = snap.val() || {};
            lastTicket = q.ticketNumber || q.queueId || q.id || q.number || '--';
            yourNumberEl.textContent = lastTicket;

            // Telegram badge
            if (q.telegramChatId) tgBadge.classList.remove('hidden'); else tgBadge.classList.add('hidden');

            // If server already marked called, alert immediately
            if (q.called === true || q.notifiedAt || q.calledAt) {
              const counterName = q.counterAssignedName || q.counterName || q.counterAssigned || null;
              alertUser(lastTicket, counterName);
              return;
            }

            // otherwise attach counter watch (tenant-scoped)
            const counterId = q.counterId || q.counterAssigned || q.counter || null;
            if (counterId) attachCounterListeners(dbInstance, tenantRefFn, counterId);
          });
          attached = true;
          break;
        } catch (e) {
          // try next candidate
          try { off(queueRef); } catch (_) {}
        }
      }
      if (!attached) {
        // last attempt: plain global /queue/{qKey}
        try {
          queueRef = ref(dbInstance, `queue/${qKey}`);
          onValue(queueRef, (snap) => {
            if (!snap.exists()) { yourNumberEl.textContent = '--'; counterNameEl.textContent = '--'; fbStatusEl.textContent = 'Queue not found'; return; }
            const q = snap.val() || {};
            lastTicket = q.ticketNumber || q.queueId || q.id || q.number || '--';
            yourNumberEl.textContent = lastTicket;
            if (q.telegramChatId) tgBadge.classList.remove('hidden'); else tgBadge.classList.add('hidden');

            if (q.called === true || q.notifiedAt || q.calledAt) {
              const counterName = q.counterAssignedName || q.counterName || q.counterAssigned || null;
              alertUser(lastTicket, counterName);
              return;
            }
            const counterId = q.counterId || q.counterAssigned || q.counter || null;
            if (counterId) attachCounterListeners(dbInstance, tenantRefFactory(dbInstance), counterId);
          });
          attached = true;
        } catch (e) {
          console.error('Failed to attach queue listener', e);
          fbStatusEl.textContent = 'Listener error';
        }
      }
    }

    // -------------------------
    // bootstrap
    // -------------------------
    (async function init() {
      // Get queueKey from query params
      function getParam(keys) {
        const usp = new URLSearchParams(window.location.search);
        for (const k of keys) { const v = usp.get(k); if (v) return v; }
        return null;
      }
      queueKey = getParam(['queueId','queueid','qid','id']);
      if (!queueKey) {
        fbStatusEl.textContent = 'Missing queueId';
        console.error('Missing queueId');
        return;
      }

      // Resolve tenant (optional)
      const slug = getSlugFromQueryOrPath();
      if (slug) {
        tenantBadge.style.display = 'block';
        tenantBadgeSlug.textContent = slug;
      }
      let tenantInfo = null;
      if (slug) {
        tenantInfo = await resolveTenant(slug);
        if (tenantInfo) {
          window.__TENANT_SLUG = slug;
          window.__TENANT_ID = tenantInfo.tenantId || slug;
          tenantBadgeId.textContent = window.__TENANT_ID;
          tenantResolved = true;
          // emit event for tenant-firebase helper / other scripts
          try {
            window.dispatchEvent(new CustomEvent('tenant.public.loaded', { detail: { tenantId: window.__TENANT_ID, slug: window.__TENANT_SLUG, config: tenantInfo.config || tenantInfo } }));
          } catch (e) { /* ignore */ }
        } else {
          // show resolved badge with slug only
          tenantBadgeId.textContent = '(unresolved)';
          console.warn('Tenant lookup returned no result for slug', slug);
          // continue and allow legacy global behaviour
        }
      }

      // Init firebase app
      try {
        app = initializeApp(siteFirebaseConfig);
        db = getDatabase(app);
        fbStatusEl.textContent = 'Connected to Firebase';
      } catch (e) {
        console.error('Firebase init failed', e);
        fbStatusEl.textContent = 'Firebase init failed';
        return;
      }

      const tenantRef = tenantRefFactory(db);

      // Attach queue listener (tenant-aware)
      try {
        await attachQueueListeners(db, tenantRef, queueKey);
        fbStatusEl.textContent = 'Listening for your number...';
      } catch (e) {
        console.warn('attachQueueListeners error', e);
        fbStatusEl.textContent = 'Listener error';
      }

      // cleanup on unload
      window.addEventListener('beforeunload', () => {
        try { if (queueRef) off(queueRef); if (counterRef) off(counterRef); } catch(_) {}
      });

    })();
  </script>
</body>
</html>
